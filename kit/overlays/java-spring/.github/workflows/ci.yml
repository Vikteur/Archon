name: CI

# The job definition that .claude/scripts/ci-local.sh reads and runs: the local CI is the verdict, so GitHub never runs
# this file on its own (no push or pull_request trigger); workflow_dispatch only keeps it a valid workflow.
# .claude/scripts/ci-workflow-check.sh holds it to its rules: every action pinned by commit SHA, every job with a
# timeout and no if, the contract checked out with the one CI secret and proved read-only, every ./gradlew run given
# the contract spec, and the job set equal to the last "CI job set" entry of docs/memory.md
# (`archon-scripts, groma, image, mutation, test`). .github/ci-inputs.yml lists each job's inputs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The contract, read with the one read-only CI secret. An empty secret fails this step and nothing after it
      # runs; the failure-only step below is gated on the gradle step's outcome.
      - name: Check out the contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: @@KIT_CONTRACT_REPO@@
          path: contract
          token: ${{ secrets.CONTRACT_TOKEN }}
      - name: Contract token is read-only
        run: bash .claude/scripts/contract-read-only-check.sh contract
      - name: Contract at the pinned ref
        run: bash .claude/scripts/contract-pin.sh contract
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '@@KIT_JAVA_VERSION@@'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # test: unit, slice and ArchUnit tests; integrationTest: @SpringBootTest and Testcontainers; build: the boot jar.
      - name: Build and test
        id: gradle
        run: ./gradlew test integrationTest build -Pcontract.spec=contract/dist/openapi.yaml --stacktrace
      # Each pinned framework item (.archon/pin-proofs.txt) is proved by a test that ran in this build.
      - name: Framework pin proof
        run: bash .claude/scripts/pin-proof-check.sh
      # No test-set-coverage step: it guards a build that skips a test set by tag, and this build splits test and
      # integrationTest by tag without skipping one (it also needs Java 24+). Add it when the build starts skipping a set.
      - name: Generated code untracked
        run: bash .claude/scripts/generated-untracked-check.sh
      - name: Java bytecode of the toolchain
        run: bash .claude/scripts/class-version-check.sh
      # The Spring Boot plugin only in application, the boot jar's layout, every module under the component scan.
      - name: Build shape
        run: bash .claude/scripts/build-shape-check.sh
      - name: Upload test reports
        if: failure() && steps.gradle.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: '*/build/reports/tests/'

  mutation:
    # The mutation gate: PIT on the main classes of the domain, usecase and gateway modules this change touches, against
    # the pull request's base, or origin/main. A change with no target passes before Gradle starts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '@@KIT_JAVA_VERSION@@'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Mutation gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash .claude/scripts/mutation-gate.sh --base "$BASE"

  image:
    # No needs: test: the image build and the tests run side by side; a red test job still fails the run. The image is
    # built and checked on every run and never shipped: no registry, no push.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The image build generates the server interfaces, so it reads the same pinned contract as the test job.
      - name: Check out the contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: @@KIT_CONTRACT_REPO@@
          path: contract
          token: ${{ secrets.CONTRACT_TOKEN }}
      - name: Contract token is read-only
        run: bash .claude/scripts/contract-read-only-check.sh contract
      - name: Contract at the pinned ref
        run: bash .claude/scripts/contract-pin.sh contract
      # The build stage's Gradle home (its RUN --mount=type=cache) outlives the runner: actions/cache keeps it between
      # runs, and buildkit-cache-dance moves it into BuildKit's cache mount before the build and back out after it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: image-gradle-cache
        with:
          path: image-gradle-cache
          key: image-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', '**/build.gradle.kts') }}
          restore-keys: image-gradle-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: '{"image-gradle-cache": "/root/.gradle"}'
          skip-extraction: ${{ steps.image-gradle-cache.outputs.cache-hit }}
          utility-image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      # ci-local.sh names the image per run (CI_IMAGE_TAG) and the check's containers, network and port (IMAGE_CHECK_*).
      # A tag set here would win over the per-run one, so the default sits in the command.
      - name: Build the image
        run: docker build --tag "${CI_IMAGE_TAG:-app:ci}" .
      # The image contract of the spring stack: the boot jar under /app on the JRE of the toolchain, uid 10001, the
      # health check on /actuator/health, and the running container answering it with status UP beside a database.
      - name: Check the image
        run: bash .claude/scripts/image-check.sh "${CI_IMAGE_TAG:-app:ci}"

  archon-scripts:
    # The script gates that need no build: the CI workflow rules (this file), and the .archon test suites a project
    # adds (four at a time, run-suites.sh; ci-local.sh narrows the glob to the suites the change touches).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: CI workflow rules
        run: bash .claude/scripts/ci-workflow-check.sh
      - name: Every .archon test suite passes
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          # The kit ships no .archon suites: the step passes with a notice until the project adds one.
          shopt -s nullglob; set -- .archon/scripts/test/*.test.sh
          [ $# -gt 0 ] || { echo "::notice::no .archon/scripts/test suites"; exit 0; }
          bash .claude/scripts/run-suites.sh "$@"

  groma:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the Groma CLI
        run: npm install -g groma.md@0.6.6
      - name: Groma architecture map is curated and in sync
        run: bash .claude/scripts/groma-check.sh
