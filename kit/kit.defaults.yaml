# .archon/kit.yaml: the project config of the Copilot kit (kit/SPEC.md). `archon kit add` writes this file into the
# project and renders the kit's @@KIT_<KEY>@@ placeholders from it; scripts read it at runtime with yq
# (.archon/scripts/kit-config.sh). Hand-written: the defaults suit a Spring Boot Gradle project.
profiles: [core, java, java-spring, openapi-contract, mijn-gezondheid]
base_branch: main
gh_accounts: [] # gh-switch-account skill: the gh accounts to switch between, e.g. [alice, alice-work]
agent_cli: copilot # install-tools.sh and kit-config.sh: the agent CLI this project runs, claude | copilot
build_workflow: build-feature-copilot
# Local CI (kit/SPEC.md, Local CI switch): true runs CI on this machine (ci-local.sh, .github/workflows/ci.yml) and
# takes its verdict by SHA. false: the project runs its own CI (GitHub Actions); kit add leaves the local-CI files out
# (manifest entries with when: local_ci) and prunes the unedited ones, kit doctor does not ask for them, and the build
# workflows take GitHub's checks on the head as the verdict.
local_ci: true
# Backlog.md (kit/SPEC.md, Backlog switch): true takes a run's ticket from the Backlog when the request names a TASK id.
# false: the project keeps its tickets elsewhere (Jira); install-tools.sh leaves Backlog.md out, a run takes the
# pasted ticket text as its ticket (ticket.sh), and backlog/ is no bookkeeping folder (ci-skip.sh, affected-check.sh).
backlog: true
java_version: 26 # kit add takes JavaLanguageVersion.of(N) of build.gradle.kts, buildSrc/ or build-logic/; set to another, it refuses
pin_proofs: .archon/pin-proofs.txt # pin-proof-check.sh: one <item>|<module>|<task>|<class> line each
build_shape: # build-shape-check.sh; "-" turns one check off, with a notice
  modules: "-" # the settings.gradle.kts modules, space-separated, e.g. "application order-adapter order-domain"
  memory_marker: "-" # a docs/memory.md decision id the build shape must name
  forbidden: "-" # a remnant no build file or workflow may name
framework_packages: ["org.springframework.."] # arch-fitness: forbidden in domain
modules: # layer globs, used by the .github/instructions applyTo fields and the scope rules
  domain: "**/*-domain/**"
  usecase: "**/*-usecase/**"
  adapter: "**/*-adapter/**"
  gateway: "**/*-gateway/**"
  platform: "**/platform/**"
generated_globs: ["**/build/generated/**"]
ci: # .github/workflows/ci.yml and ci-workflow-check.sh
  gradle_line: "./gradlew test integrationTest build" # CI's test-job Gradle run, every task named, none excluded (build-shape-check.sh's tasks)
gates: # .claude/scripts/ci-gate.sh (kit/SPEC.md, Report-only gates): report prints a finding and passes, block fails the
  # job. Every gate ships report; switching one to block is a gate change (a dated docs/memory.md entry, gate-change-check.sh).
  tests_ran: report # the test job's JUnit XML counts more than zero tests
  format: report # ./gradlew spotlessCheck, when the build applies Spotless
  coverage: report # ./gradlew jacocoTestReport and the line and branch coverage, when the build applies JaCoCo; no threshold
  secrets: report # gitleaks over the checkout (archon-scripts job), redacted
  contract_lint: report # spectral lint of contract.spec_path (openapi-contract profile)
commands:
  test: "./gradlew test"
  integration_test: "./gradlew integrationTest"
  check: "./gradlew check"
contract:
  server_name: contract-api
  repo: "" # owner/repo of the contract hub
  spec_path: contract/dist/openapi.yaml
  tag_key: contractTag # gradle.properties key that pins the contract
  checkout_step: "Check out the contract" # ci-workflow-check.sh: the name of the contract checkout step in ci.yml
  generated_dir: "" # e.g. shared-adapter/build/generated/openapi/src/main/java/com/acme/api
  api_package: "" # e.g. com.acme.api
