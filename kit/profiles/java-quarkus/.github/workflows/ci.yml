name: CI

# GitHub Actions is dropped (owner decision D21, 2026-10-20, docs/memory.md): no push or pull_request trigger, so GitHub
# never runs this file on its own. It stays the job definition that .claude/scripts/ci-local.sh reads and runs, the CI
# verdict; workflow_dispatch only keeps it a valid workflow. With no push trigger, the per-ref concurrency group went too:
# ci-local's queue orders the runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The private contract, read with the one read-only CI secret (UD-15.e). An empty secret fails this step and
      # nothing after it runs; the failure-only steps below are gated on the gradle step's outcome.
      - name: Check out rekord-contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: @@KIT_CONTRACT_REPO@@
          path: contract
          token: ${{ secrets.CONTRACT_TOKEN }}
      - name: Contract token is read-only
        run: bash .claude/scripts/contract-read-only-check.sh contract
      - name: Contract at the pinned ref
        run: bash .claude/scripts/contract-pin.sh contract
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build and test
        id: gradle
        run: ./gradlew test integrationTest build -Pcontract.spec=contract/dist/openapi.yaml --stacktrace
      - name: Framework pin proof
        run: bash .claude/scripts/pin-proof-check.sh
      # The build skips a slow test set whose tag no compiled test class of the module names (PR #113); this gate fails
      # when that skip would drop a test whose JUnit tags reach it from another module (CI plan C19, D11).
      - name: Test set coverage
        run: bash .claude/scripts/test-set-coverage.sh
      - name: Generated code untracked
        run: bash .claude/scripts/generated-untracked-check.sh
      - name: Java 26 bytecode
        run: .claude/scripts/class-version-check.sh
      - name: Build shape
        run: .claude/scripts/build-shape-check.sh
      - name: Upload test reports
        if: failure() && steps.gradle.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: '*/build/reports/tests/'

  mutation:
    # The mutation gate (decisions 2026-10-18): PIT on the main classes of the domain, usecase and gateway modules this
    # change touches, against the pull request's base, or origin/main on a push. A push to main has no diff to origin/main and
    # passes before Gradle starts. Runs beside test, on every push, with no path filter (UD-15.e).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Mutation gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash .claude/scripts/mutation-gate.sh --base "$BASE"
      - name: Mutation gate tests
        run: bash scripts/test/mutation-gate.test.sh

  image:
    # No needs: test (owner decision D10, 2026-10-20): the image build and the tests run side by side; a red test job still
    # fails the run.
    # Phase 0 builds and checks the image on every run and never ships it (UD-13.e): no registry, no push.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The image build generates the server interfaces, so it reads the same pinned contract as the test job.
      - name: Check out rekord-contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: @@KIT_CONTRACT_REPO@@
          path: contract
          token: ${{ secrets.CONTRACT_TOKEN }}
      - name: Contract token is read-only
        run: bash .claude/scripts/contract-read-only-check.sh contract
      - name: Contract at the pinned ref
        run: bash .claude/scripts/contract-pin.sh contract
      - name: Image job wiring
        run: bash scripts/test/ci-image.test.sh
      - name: Image check refuses a wrong image
        run: bash scripts/test/image-check.test.sh
      # The script suites that need the JDK, Gradle and the contract checkout, moved here from the test job (owner
      # decision 2026-10-23): this job already has the contract, and its ~40 s leave room beside the test job's build.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Codegen tests
        run: bash scripts/test/generated-untracked-check.test.sh && bash scripts/test/codegen.test.sh
      - name: WireMock harness
        run: bash scripts/test/wiremock-harness.test.sh
      # The build stage's Gradle home (its RUN --mount=type=cache) outlives the runner: actions/cache keeps it between
      # runs, and buildkit-cache-dance moves it into BuildKit's cache mount before the build and back out after it.
      # Without it, every fresh runner downloads the Gradle distribution and every dependency again.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: image-gradle-cache
        with:
          path: image-gradle-cache
          key: image-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', '**/build.gradle.kts') }}
          restore-keys: image-gradle-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: '{"image-gradle-cache": "/root/.gradle"}'
          # An exact hit already holds what this build needs; extracting it again only costs time.
          skip-extraction: ${{ steps.image-gradle-cache.outputs.cache-hit }}
          # busybox 1.37 by digest, not the action's default latest tag.
          utility-image: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      - name: Build and check the image
        run: bash scripts/test/image.test.sh

  archon-scripts:
    # The shell test suites of the build-feature scripts (.archon/scripts/test/*.test.sh), moved here from the
    # weddingapp umbrella, now an archive. ubuntu-latest ships the bash, git, node, jq and yq
    # they need; archon, groma and backlog are stubbed by the suites themselves.
    # 30 minutes: alone it takes ~3.5 min, but beside a build-feature run it took 13.8 (2d1461f) of the 15 it had.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Four suites at a time (run-suites.sh). ci-local.sh narrows the glob to the suites the change touches.
      - name: Every .archon test suite passes
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          bash .claude/scripts/run-suites.sh .archon/scripts/test/*.test.sh
      # Every other script suite of the repo, eight at a time and the longest first (owner decision 2026-10-23: one
      # by one they took ~180 s). The workflow and scaffold suites came over from job test: they need no build; the
      # test-set-coverage suite too (2026-10-23): it compiles its own throwaway trees with the runner's javac.
      # AUDIT_LOG_STRICT: the audit hook fix is applied, so every expect of audit-log-args is a check (2026-10-18).
      - name: Every script suite passes
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          npm ci --prefix scripts/scaffold --silent
          bash .claude/scripts/ci-workflow-check.sh
          AUDIT_LOG_STRICT=1 SUITE_JOBS=8 bash .claude/scripts/run-suites.sh \
            scripts/test/ci-local.test.sh scripts/test/ci-plan.test.sh scripts/test/ci-workflow.test.sh \
            scripts/test/ci-workflow-check.test.sh scripts/test/ci-queue.test.sh scripts/test/affected-check.test.sh \
            scripts/test/run-suites.test.sh scripts/test/install-tools.test.sh scripts/test/web-uis.test.sh \
            scripts/test/tokenomics.test.sh scripts/test/scaffold.test.sh scripts/test/pin-proof-check.test.sh \
            scripts/test/contract-read-only-check.test.sh scripts/test/contract-pin.test.sh \
            scripts/test/audit-log-args.test.sh scripts/test/audit-log.test.sh scripts/test/ci-status-grammar.test.sh \
            scripts/test/ci-ledger.test.sh scripts/test/ci-audit.test.sh scripts/test/gate-change-check.test.sh \
            scripts/test/ci-cost.test.sh scripts/test/agent-script-names.test.sh scripts/test/groma-delta.test.sh \
            scripts/test/archon-suites.test.sh scripts/test/test-set-coverage.test.sh

  groma:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the Groma CLI
        run: npm install -g groma.md@0.6.6
      - name: Groma architecture map is curated and in sync
        run: bash .claude/scripts/groma-check.sh
      - name: Pre-push hook stops a push the map check rejects
        run: bash scripts/test/pre-push.test.sh
