# The tools this project needs on a developer machine, and their pinned versions. scripts/install-tools.sh reads
# this file (and nothing else needs to: no jq, no node, they may not be installed yet); docs/archon/setup.md section 1
# points here. The order is the install order: node comes before the npm tools.
#
# Columns, separated by "|":
#   name | version | kind | Windows (winget id, npm package or install URL) | macOS (brew formula, cask:<name>, ...) | check command
# version: "-" any version, ">=X.Y" a minimum, anything else a prefix of the version ("1.53.0" exact, "25" a major).
# kind: pkg (winget / brew), npm (npm install -g, pinned when the version is exact), script (an installer script).
# The check command's output is read for the first version number.
# Linux uses the macOS column for npm and script tools; jq, yq and gh are release downloads (install-tools.sh), and git,
# node, java and docker are only checked there.
#
# name      | version  | kind   | Windows                          | macOS                        | check command
git         | -        | pkg    | Git.Git                          | git                          | git --version
gh          | -        | pkg    | GitHub.cli                       | gh                           | gh --version
# node runs the npm tools below (backlog, groma, codegraph); groma needs Node 20.19 or newer
node        | >=20.19  | pkg    | OpenJS.NodeJS.LTS                | node                         | node --version
# jq and yq are used by the scripts under .claude/hooks
jq          | 1.       | pkg    | jqlang.jq                        | jq                           | jq --version
yq          | 4.       | pkg    | MikeFarah.yq                     | yq                           | yq --version
# wedding-portal's Gradle toolchain is Java 25
java        | 26       | pkg    | EclipseAdoptium.Temurin.26.JDK   | cask:temurin@26              | java -version
# Testcontainers in wedding-portal's tests and the image build need a Docker daemon
docker      | -        | pkg    | Docker.DockerDesktop             | cask:docker                  | docker --version
# the agent that Archon drives and that works on the tickets
claude      | -        | script | https://claude.ai/install.ps1    | https://claude.ai/install.sh | claude --version
# the GitHub Copilot CLI: the other agent Archon can drive (.archon/copilot/, docs/archon/copilot.md)
copilot     | 1.0.114  | npm    | @github/copilot                  | @github/copilot              | copilot --version
# runs the build-feature workflows under wedding-portal's .archon/
archon      | -        | script | https://archon.diy/install.ps1   | https://archon.diy/install   | archon version
# the task board (wedding-portal's backlog/); agents read and write tickets through its CLI
backlog     | 1.53.0   | npm    | backlog.md                       | backlog.md                   | backlog --version
# the architecture map in wedding-portal; 0.6.6 is the pin wedding-portal's CI installs
groma       | 0.6.6    | npm    | groma.md                         | groma.md                     | groma --version
# the MCP server agents navigate the code with (.codegraph/ index)
codegraph   | 1.6.2    | npm    | @colbymchenry/codegraph          | @colbymchenry/codegraph      | codegraph --version
