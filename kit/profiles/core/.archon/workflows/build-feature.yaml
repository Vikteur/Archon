name: build-feature
description: |
  Use when: building one Backlog ticket (name its TASK-n) or one small request, end to end in this repo.
  Steps: read the ticket and build the plan's context pack -> map the code the request touches -> plan (no Gradle; no
  approval stop; STOP items the ticket or the plan touches are named in the pull request) -> per step, the test agent
  writes failing tests, then the build agent makes them pass -> review -> test-first check -> fold a fresh Groma scan into the architecture map, curate what it added, and link the ticket to
  the map elements it changed (repos with groma/ only) -> push and open a DRAFT pull request -> wait for CI by commit
  SHA, fix a red run (at most 3 rounds) -> mark it ready -> wait until every review is done and CI on its head is green
  (the GitHub agent resolves a merge conflict or a red run on the way) -> wait for the delegator or the owner to merge
  it (the run never merges) -> finalize the Backlog ticket (Done) ->
  commit and push the Backlog ticket, and delete the run's branch and worktree. The retro (lessons learned and the
  ticket's ADRs) is not part of this workflow: it is launched separately, after the pull request is merged (see
  docs/retro/README.md).
  NOT for: contract (spec) changes in the hub repo, or work spanning several tickets.

# Model policy (UD-21.a, amended by UD-21.f): @analyse (Claude Opus 5.5) plans, reviews and diagnoses; @build (Claude
# Sonnet 5.5) writes code, tests and the pull request text. The review node may commit test-first fixes for its own
# findings. Every commit trailer names the model that wrote the commit. Both aliases are defined in .archon/config.yaml.
# Deterministic steps are scripts in .archon/scripts (P2): reading the ticket, listing the STOP items, the push, CI by
# SHA, the merge gate.
# No human gate (owner decision 2026-10-17, docs/memory.md): the run never pauses for a STOP approval. It never merges
# its own pull request either (owner decision 2026-10-18, docs/memory.md, TASK-58): once every review is done and CI is
# green it waits for the delegator or the owner to merge it.
# Skills: `skills:` on a node is the exact allow-list for that node (without it the node gets no skill at all). The plan
# writes a `Test skills:` and a `Build skills:` line per step from the table in the plan prompt, each from that agent's
# own allow-list; the test agent loads its line and the build agent its own with the Skill tool, plus code-generation;
# the skill-check node fails the run when one was never loaded.
# The plan itself always loads clean-architecture, and contract-slice, contract-db-parity and design-review only when
# the request needs them.
# Scaffolding (P2): before writing a new file, the test and build agents run `scripts/scaffold.sh --for <path>`, which
# names each scaffold template whose `## Scaffold` Target in docs/code-maps matches the path and prints the command that
# renders it, and render its base case with that command. It is mandatory (owner decisions 2026-10-18 and 2026-10-23):
# the scaffold-check node fails the run on a source file written by hand that plan.md does not name on a
# `Hand-written: <path> — no-template: <shape>` line (no template targets it) or a
# `Hand-written: <path> — template-misfit: <template> — <why>` line (one does, and it does not fit).
nodes:
  - id: ticket
    bash: |
      # The run trace (skills, templates, scripts per node) in the ARTIFACTS tab; it follows the run and exits when it ends.
      node .archon/scripts/run-trace.js --start "$WORKFLOW_ID" "$ARTIFACTS_DIR" >/dev/null 2>&1 || true
      out=$(bash .archon/scripts/ticket.sh "$ARGUMENTS") || exit $?
      # The portal-api and CodeGraph MCP servers need git-ignored things in this worktree (node_modules, the contract,
      # the readiness report; the .codegraph/ index). mcp-setup.sh readies both and writes .archon/mcp/build-tools.json
      # with only the servers that are ready: the nodes below declare it as an optional `mcp:`, and a server in it
      # that cannot start would fail them (docs/mcp/plan.md, A3). A failure only costs the nodes those tools.
      bash .archon/scripts/mcp-setup.sh --status "$ARTIFACTS_DIR/mcp-status.txt" >&2 \
        || echo "mcp-setup.sh failed; the nodes run without the MCP tools" >&2
      # The plan's context pack (P2): the facts every plan looked up on its own, after mcp-setup.sh so that its section of
      # the operations the ticket names finds the contract and node_modules. A failure only costs the plan reads.
      bash .archon/scripts/plan-context.sh "$ARTIFACTS_DIR/ticket.md" > "$ARTIFACTS_DIR/plan-context.md" \
        || echo "plan-context.sh failed; the plan reads the files itself" >&2
      printf '%s\n' "$out"
    output_format:
      type: object
      properties:
        task: { type: string }
        stop: { type: string }
      required: [task, stop]

  # A cheap, read-only map of the code the request touches, so the plan starts from facts instead of a search.
  - id: explore
    depends_on: [ticket]
    model: "@scout"
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Grep, Glob, Write, "Bash(git log *)", "Bash(git ls-files *)", "mcp__portal-api__*",
      "mcp__codegraph__*"]
    mcp: { path: .archon/mcp/build-tools.json, optional: true }
    skills: [clean-architecture]
    retry: { max_attempts: 3, delay_ms: 5000, on_error: transient }
    idle_timeout: 600000
    prompt: |
      Request: $ARGUMENTS
      Backlog ticket: $ticket.output.task (full text in $ARTIFACTS_DIR/ticket.md when it is set).
      Read $ARTIFACTS_DIR/ticket.md and $ARTIFACTS_DIR/plan-context.md first; read a file only for what they do not say,
      and each file once.
      If mcp__portal-api__* or mcp__codegraph__* tools are in your tool list (the ticket node's mcp-setup.sh
      readied them), use them before Read and Grep:
      - `where` (operationId, tag or status) for where an operation is built, whether it is a stub, and its tests;
      - `codegraph_explore` for how an area works; `codegraph_callers` and `codegraph_impact` for who calls a symbol and
        what a change to it reaches (every place that writes the state the request changes);
      - `search` and `read` for an operation of the contract, never a Read of contract/.
      Grep stays the tool for text, config, logs and strings; without the tools, read as before.
      Map the code this request touches; change nothing. Write $ARTIFACTS_DIR/explore.md once, at the end, at most 120
      lines:
      - the files and symbols involved, each with its layer (domain, usecase, adapter, gateway, platform; see
        .claude/rules/ and docs/code-maps/clean-architecture.md) and one line on what it does;
      - the existing tests that cover them, and the test command for each module;
      - every place that writes the state the request changes;
      - open questions the plan must answer.
      Facts only, with paths. Do not plan and do not propose a design.

  # The analyst: one Opus agent reads the ticket and the explore notes and writes plan.md in the format the later
  # nodes read (checkbox steps, Test/Build skills lines, Scaffold, Hand-written and Pin lines), then takes the STOP
  # decision.
  # Archon's own plan block was tried in its place for a few runs (2026-10-23) and dropped again (owner decision
  # 2026-10-24, docs/memory.md); every rule added to it in that trial is in this prompt.
  - id: plan
    depends_on: [explore]
    model: "@analyse"
    skills: [clean-architecture, contract-slice, contract-db-parity, design-review]
    mcp: { path: .archon/mcp/build-tools.json, optional: true }
    # No Gradle and no test suite in the plan (owner decision 2026-10-18): the wrapper, every script that runs Gradle and
    # every test-suite run are denied. The one exception is .archon/scripts/plan-spike.sh, which matches none of these.
    # .archon/scripts/test/plan-spike.test.sh holds this list to every script that runs ./gradlew.
    denied_tools: ["Bash(*gradlew*)", "Bash(*affected-check*)", "Bash(*build-shape-check*)", "Bash(*mutation-gate*)",
      "Bash(*step-gate*)", "Bash(*ci-local*)", "Bash(*local-ci-run*)", "Bash(bash *.test.sh*)", "Bash(sh *.test.sh*)",
      "Bash(./*.test.sh*)", "Bash(scripts/test/*.test.sh*)", "Bash(.archon/scripts/test/*.test.sh*)", "Bash(*smoke*)",
      "Monitor"]
    prompt: |
      Request: $ARGUMENTS
      Backlog ticket: $ticket.output.task. Read its full text in $ARTIFACTS_DIR/ticket.md first (it is there when the
      request names one); never search the disk for it.
      Then read $ARTIFACTS_DIR/plan-context.md (dependency tickets, modules, workflow nodes, docs/memory.md sections,
      every script's header and test) and $ARTIFACTS_DIR/explore.md (the code the request touches). Read a file only for
      what they do not say, and read each file once, a script too, with the Read tool: note what you need the first
      time.
      If mcp__portal-api__* or mcp__codegraph__* tools are in your tool list (the ticket node's mcp-setup.sh
      readied them), use them before Read and Grep:
      - `usedBy` (a schema or schema.field) for every operation a contract or pin change reaches, request or response;
      - `schema` for a schema's fields; `where` for an operation's controller, stub status and tests;
      - `codegraph_impact` for what a change to a Java symbol reaches.
      Grep stays the tool for text, config, logs and strings; without the tools, read as before.
      Write an implementation plan for exactly this request to $ARTIFACTS_DIR/plan.md, once, when the plan is complete:
      do not write a draft and rewrite it.
      Run no Gradle and no test suite. The one exception: for a design question the plan states and the code cannot
      answer, run `bash .archon/scripts/plan-spike.sh "$ARTIFACTS_DIR" <one task> "<the question>"` once (one Gradle
      task, offline, in a scratch copy of HEAD; the question must not contain the word gradlew) and write its answer
      into the step. Any other experiment is a step of the plan, for the build agent.
      Load clean-architecture with the Skill tool first, always (skill-check fails the run when the plan never loaded
      it), and place every step in its layer by it and the docs/code-maps leaves of the skills it touches. Load the others with the Skill tool only when the request needs them:
      - contract-slice when a step touches a REST endpoint, a controller or the contract: read only the operations of
        the tags the step touches, never the whole spec;
      - contract-db-parity when a step changes the database schema: run its script as its docs/code-maps leaf says and
        write the findings that touch the step into it;
      - design-review when the plan has a one-way door (a database migration, the contract, authentication or
        authorization, a new module): add a short `## Design` section with the chosen option, at least one alternative
        with its trade-off, and the one-way doors. No `## Design` section otherwise.
      Copy every literal input the ticket gives (values, names, messages, paths, limits) into the step that uses it, word
      for word: the build agents read the plan, not the ticket.
      Trace every path that writes what a step changes (each caller, each node, each script), not only the first one.
      When a step relies on a tool's default (a flag, an exit code, a format), find what it actually does (its source,
      its --help, or a run that is not Gradle and not a test suite) and write that into the step.
      Name only workflow nodes that exist in .archon/workflows/build-feature.yaml.
      When the ticket names a guard or a gate, list up front everything it must refuse, each with the test that
      proves the refusal.
      Add a `## Decisions → tests` table: every owner decision, STOP option and acceptance criterion in the ticket,
      with the test that fails without it. A row with no test is a gap in the plan.
      Scaffolding is mandatory: a new file whose path a `## Scaffold` Target in docs/code-maps matches is rendered
      with scripts/scaffold.sh first (the build agents run `scripts/scaffold.sh --for <path>`, which prints the
      command), and the scaffold-check node fails the run on a source file written by hand that the plan does not
      name. Name each file the plan adds that no template renders on its own line under the step that adds it, in
      one of two forms: `Hand-written: <repo-relative path> — no-template: <shape>` when no Target matches the path
      (<shape> in kebab-case, the word earlier plans used for that kind of file: enum, exception, ...), or
      `Hand-written: <repo-relative path> — template-misfit: <template> — <why>` when one matches but the
      template does not fit what the file needs. Files of one shape under one directory can be named once, as
      `Hand-written: <dir>/** — no-template: <shape>`.
      Name the renders too, so a script makes them before the agents start: under the step that adds a new file a
      template renders, add one line `Scaffold: <template> <repo-relative path> <vars>`, where <vars> is one JSON
      object on one line with that template's variables (its header's `Vars:` lines name each one;
      `scripts/scaffold.sh --for <path>`, which writes nothing, prints them with what the path gives filled in, and
      is the only scaffold.sh command the plan runs: never render a file yourself). Leave out `package` and the
      path's placeholders such as `<Name>`: the script fills them in from the path. Choose the template when several
      target the path, take every literal value from the ticket (examples, column names, messages), and write the
      JSON as it is, without shell quotes: the line is parsed, never run, so an apostrophe in SQL stays as written.
      A file under a test tree is rendered before the test agent starts, any other after the step's tests are
      committed; a file that exists already gets no line (the step changes it). A line that cannot render costs the
      agent a render (it falls back to `--for`), never the run.
      Write every step as a Markdown checkbox line `- [ ] ...`; each step names the tests that are written first and fail
      until the step is built (tests first, always). Fold a docs-only change into the step it documents.
      A step that adds a port (a new Repository or Gateway interface, or a file under a usecase module's repository/
      package) delivers its adapter (or a stub) in the same step: the use case that injects it is a bean, so every
      Quarkus test fails on the unsatisfied port until the adapter exists. plan-check fails a plan that names a
      port's `Default<Name>` adapter only in a later step.
      Under every step, add two lines, one per agent, each with only the skills from that agent's column that fit
      what the step touches (the skill names, not the paths): `Test skills: <names>` for the test agent and
      `Build skills: <names>` for the build agent. A step touches several rows when it changes several things.
        | What the step touches             | Test skills                              | Build skills                                                     |
        | any code or test                  | tdd-loop, jvm-testing                    | java, clean-code                                                 |
        | domain type                       | object-mother-builders                   | domain-modeling, validation-notification-result                  |
        | domain event                      |                                          | domain-events                                                    |
        | use case                          | usecase-bdd-spec, object-mother-builders | usecase-orchestration, validation-notification-result            |
        | controller, error mapping         |                                          | api-first-controller, exception-to-http                          |
        | mapper (domain ↔ DTO)             | domain-to-dto-mapper-tests               | domain-dto-mapper                                                |
        | repository, entity                | testcontainers                           | persistence-repository, jpa-entity-mapping                       |
        | database schema                   | testcontainers                           | flyway-migrations                                                |
        | gateway, remote call              |                                          | resilience4j, domain-dto-mapper                                  |
        | CDI wiring, config, profiles      |                                          | bean-config-di                                                   |
        | generated code, codegen in build  |                                          | code-generation                                                  |
        | test against a real service       | testcontainers                           |                                                                  |
        | architecture rule                 | archunit-fitness                         |                                                                  |
      `none` on a line only when that agent writes nothing for the step (scripts, workflows, docs; a pin-only or
      verify-only step has `Build skills: none`).
      The templates under docs/scaffold-templates/ and the docs/code-maps leaves of those skills are the conventions.
      Never write a step that only runs tests, checks or gates: affected-check, tdd-check, the mutation gate, review and
      CI run them all later in this workflow. An acceptance criterion a check proves goes under a `## Checks for review`
      section (the check and the criterion), not in a step. A step that adds no behaviour and only updates docs, or
      only runs one named generator, cannot have a failing test: write it as `- [ ] (verify only) ...`. A step that only adds tests for behaviour that already exists (it pins the
      behaviour) is `- [ ] (pin only) ...`: its tests are proven by a mutation that turns them red.
      A plan has at most one `(pin only)` step, holding every pin of the plan (pinned behaviour exists before the
      run, so its place does not matter), with one line `  - Pin: <class>: <behaviour>` under it for each behaviour it
      pins, and the skills of all of them.
      Plan only code, tests and local commits: the push, the pull request and reading CI are later nodes of this
      workflow, so never write them as a checkbox step.
      Then decide whether the plan touches the STOP list of .claude/CLAUDE.md (a contract push, a database migration
      once a production database exists (none yet), authentication or authorization, encryption or what gets logged,
      deleting a branch, worktree or history that is not all in main, secrets, production configuration, or what is
      deployed). Answer stop=true with the item in stop_reason, or stop=false with an empty reason.
    output_format:
      type: object
      properties:
        stop: { type: boolean }
        stop_reason: { type: string }
      required: [stop, stop_reason]

  # Holds the plan to what the implement loop needs, before any agent starts: a plan.md without open checkbox steps,
  # or a step without its Test skills and Build skills lines, fails the run rather than letting the loop end at once
  # with nothing built. So does a step that adds a port whose adapter comes only in a later step
  # (plan-order.js; owner decision 2026-10-23, docs/memory.md): the run would block mid-loop on the unsatisfied bean.
  - id: plan-check
    depends_on: [plan]
    runtime: bun
    script: |
      const fs = require('fs');
      const fail = (msg) => { console.error(`plan-check: ${msg}`); process.exit(1); };
      const pf = `${process.env.ARTIFACTS_DIR}/plan.md`;
      const text = fs.existsSync(pf) ? fs.readFileSync(pf, 'utf8') : '';
      if (!text.trim()) fail(`no plan at ${pf}`);
      const lines = text.split('\n');
      const count = (re, from = lines) => from.filter((l) => re.test(l)).length;
      const steps = count(/^\s*- \[ \]/);
      if (steps === 0) fail("plan.md has no '- [ ]' step");
      // A skill line may be a list item under its step (`  - Test skills: ...`), as skill-check.js reads it too; one
      // inside a code fence (three or more backticks or tildes, closed by the same character) is a sample that
      // skill-check.js does not read, so it is not counted either (TASK-77).
      let fence = '';
      const open = lines.filter((l) => {
        const mark = (/^\s*(`{3,}|~{3,})/.exec(l) || [])[1];
        if (mark && (!fence || mark[0] === fence)) { fence = fence ? '' : mark[0]; return false; }
        return !fence;
      });
      const tests = count(/^\s*(?:[-*]\s+)?Test skills:/, open), builds = count(/^\s*(?:[-*]\s+)?Build skills:/, open);
      if (tests < steps || builds < steps) fail(`${steps} steps but ${tests} 'Test skills:' and ${builds} 'Build skills:' lines`);
      const order = require('child_process').spawnSync('node', ['.archon/scripts/plan-order.js', pf], { encoding: 'utf8' });
      if (order.status !== 0) fail(`a step order to fix before any code is written:\n${order.stderr || order.error}`);
      console.log(`plan-check: ${steps} steps`);

  # Did explore and plan ask the MCP servers, or search the code and the contract by hand? Counts each node's tool calls
  # from the run's log into $ARTIFACTS_DIR/mcp-use.md, which pr-refresh.sh copies into the pull request
  # (docs/mcp/plan.md, C8). Report only: it never holds the run.
  - id: mcp-use
    depends_on: [plan]
    bash: |
      node .archon/scripts/mcp-use-check.js "$ARTIFACTS_DIR" "$WORKFLOW_ID" explore plan || true

  # The STOP items the ticket labels or the plan name are listed for the pull request; nothing pauses on them.
  # stop-items.txt is what pr-refresh.sh writes as the body's "STOP items touched:" line, the line stop-check.sh reads
  # (P2: a model once worded it "This ticket touches no STOP item." and the merge waited for the owner, PR #196).
  - id: stop-route
    depends_on: [plan-check, mcp-use]
    bash: |
      labels=$ticket.output.stop
      planned=$plan.output.stop
      reason=$plan.output.stop_reason
      why=""
      [ -n "$labels" ] && why="ticket labels: $labels"
      [ "$planned" = "true" ] && why="${why:+$why; }plan: $reason"
      printf '%s\n' "$why" > "$ARTIFACTS_DIR/stop-items.txt"
      pause=false; [ -n "$why" ] && pause=true
      node -e 'console.log(JSON.stringify({ pause: process.argv[1] === "true", why: process.argv[2] }))' "$pause" "$why"
    output_format:
      type: object
      properties:
        pause: { type: boolean }
        why: { type: string }
      required: [pause, why]

  # Tests first, always (TDD): per plan step the test agent writes the failing tests and commits them alone, then the
  # build agent writes the code that makes them pass. tdd-check proves the order before anything is pushed.
  # An agent that cannot go on without an answer writes a `BLOCKED: <question>` line in plan.md instead of asking a
  # question nobody can answer mid-loop. The loop body checks for it after each agent (tests-check, step-check:
  # blocked-stop.sh first), so the run fails at the step that asked, with the question, and never reaches skill-check or
  # tdd-check with steps nobody built; a build agent never builds a step whose test agent blocked. The owner answers
  # with an `ANSWER:` line in place of the `BLOCKED:` one and resumes the run: the loop starts again at the first open
  # step. No run pauses for it (no human gate, owner decision 2026-10-17): the run fails.
  # Then the same node checks the step right after the agent that worked on it (step-check.js; owner decision
  # 2026-10-23, docs/memory.md), not only the gates after the loop: the skills the step names (and those of the steps
  # folded into it) were loaded, and no file the agent added since step-base is one the scaffold-check gate would refuse
  # (written by hand and not named on a `Hand-written:` line in a form that holds for it; on the build side also a
  # `Hand-written:` line in neither form). On a miss it writes skills-missing.md or scaffold-missing.md and the loop goes round again: a
  # test-side miss skips the build agent, a build-side miss opens the step again in the plan, and the next agent fixes
  # it. skill-check and scaffold-check after the loop stay the gates.
  # The build agent's green check is affected-check.sh, never the full suite (owner decision 2026-10-17,
  # docs/memory.md): CI on the pull request runs the full suite, and a full local run per step cost 3 to 5 minutes.
  # AFFECTED_NO_SYNC=1 because this workflow rebases onto the base in rebase-main and never merges it in.
  # Per-step base (R13, roadmap T9): step-base keeps the HEAD from before a step's first test commit, per step, and the
  # build agent's affected-check diffs against it (AFFECTED_BASE), so a step runs the tests of its own change, not of
  # every step before it. The same step going round again (a red build, a skills or scaffold miss) keeps its first base.
  # Renders first (P2; docs/memory.md, 2026-10-24): scaffold-tests renders the step's `Scaffold:` plan lines for test
  # trees before the test agent, scaffold-build the others once the step's tests are committed, so the red run never
  # sees code (.archon/scripts/scaffold-step.js: never through a shell, a line once per run, never fatal). Each writes
  # scaffold-render/step-<n>-<side>.md for its agent, which still runs scaffold.sh --for for every other new file.
  - id: implement
    depends_on: [stop-route]
    loop_group:
      max_iterations: 10
      until_bash: |
        grep -qE '^BLOCKED:' "$ARTIFACTS_DIR/plan.md" || ! grep -qE '^\s*- \[ \]' "$ARTIFACTS_DIR/plan.md"
      nodes:
        - id: step-base
          bash: |
            pf="$ARTIFACTS_DIR/plan.md"
            [ -f "$pf" ] || { echo "step-base: no plan at $pf" >&2; exit 1; }
            n=$(grep -E '^[[:space:]]*- \[[ xX]\]' "$pf" | grep -nE '^[[:space:]]*- \[ \]' | head -1 | cut -d: -f1)
            [ -n "$n" ] || { echo "step-base: no open step"; exit 0; }
            keep="$ARTIFACTS_DIR/step-base-${n}.sha"
            [ -s "$keep" ] || git rev-parse HEAD > "$keep" || exit 1
            cp "$keep" "$ARTIFACTS_DIR/step-base.sha" || exit 1
            echo "step-base: step ${n} diffs against $(cut -c1-12 "$keep")"
        - id: scaffold-tests
          depends_on: [step-base]
          bash: |
            node .archon/scripts/scaffold-step.js "$ARTIFACTS_DIR" test \
              || echo "scaffold-step.js failed; the test agent renders the step's files itself" >&2
        - id: write-tests
          depends_on: [scaffold-tests]
          model: "@build"
          # Commits go through the commit-shape hook (D12): no agent of a run skips it, and no background command or
          # Monitor stands in for a foreground run (R13).
          denied_tools: ["Bash(*--no-verify*)", "Bash(*commit -n *)", "Monitor"]
          skills: [tdd-loop, jvm-testing, object-mother-builders, usecase-bdd-spec, testcontainers,
                    archunit-fitness, domain-to-dto-mapper-tests, code-generation]
          mcp: { path: .archon/mcp/build-tools.json, optional: true }
          prompt: |
            Request: $ARGUMENTS
            You are the test agent: you write tests, never production code.
            If mcp__portal-api__* or mcp__codegraph__* tools are in your tool list (the ticket node's mcp-setup.sh
            readied them), use them before Read and Grep:
            - `schema` for the fields a mother, fixture or request body needs;
            - `where` for an operation's existing HTTP tests and unit tests, to extend them instead of writing a second one;
            - `codegraph_callers` for the existing tests of a class.
            Grep stays the tool for text, config, logs and strings; without the tools, read as before.
            Read $ARTIFACTS_DIR/plan.md and take the first step still marked `- [ ]`; n is its position among the
            plan's checkbox lines (the first checkbox is 1).
            If $ARTIFACTS_DIR/skills-missing.md exists, read it first: an agent of this step never loaded the skills
            it names. When it names `Test skills:`, load each with the Skill tool, check this step's tests against
            them, fix what they change, run the tests again into $ARTIFACTS_DIR/red/step-<n>.log and commit any change
            as below; then stop. When it names `Build skills:`, the tests stand: change nothing and stop.
            If $ARTIFACTS_DIR/scaffold-missing.md exists, read it first too: when its title says `test side`, do what
            it says for each file it names, run the tests again into $ARTIFACTS_DIR/red/step-<n>.log, commit, and stop.
            When it says `build side`, the tests stand: change nothing and stop.
            A step that pushes, opens the pull request or reads CI is done by later nodes of this workflow: write
            nothing for it and stop.
            A step marked `- [ ] (verify only)` adds no behaviour: write nothing for it and stop.
            A step marked `- [ ] (pin only)` pins behaviour that exists: write its tests, then for each `Pin:` line under
            it break the code once (remove the guard or flip the condition the test pins), run the tests, append that
            red output to $ARTIFACTS_DIR/red/step-<n>.log after a line `MUTATION: <file>: <what you broke>`, and revert
            the code from git, that file only, before the next one. Commit only the tests.
            Load every skill on the step's `Test skills:` line with the Skill tool, and code-generation. Scaffold
            first. The scaffold-tests node has rendered this step's `Scaffold:` lines for test trees: read
            $ARTIFACTS_DIR/scaffold-render/step-<n>-test.md (none there: every new test file is yours, as below). A
            file it lists as rendered is its template's base case:
            make it the step's test with Edit and commit it with the other tests, or delete it when the step does not
            need it; a failed line or an existing file is yours, as the report says. For every other new file under a
            test tree the step needs (a test class, a Mother, a fixture), run
            `scripts/scaffold.sh --test --for <path>` before you write it. It names each template whose Target matches
            the path, with its variables and what it leaves out, and prints the command that renders it: render the
            base case with that command (put in the variables it leaves as <...>), then edit the file with Edit; never write a
            rendered file over whole (Write, `cat >`): scaffold-check counts that as written by hand, and the render, its
            variables and the read-back were tokens for nothing. A template that does not fit (placeholder variables, an
            enum where it renders a class) is not rendered at all: write the file by hand with the template-misfit line. scaffold-check
            fails the run on a source file written by hand that the plan does not name: when --for finds no template,
            add the line it prints, `Hand-written: <repo-relative path> — no-template: <shape>`, under the step in the plan;
            when the templates it finds do not fit what the file needs, write it by hand and add
            `Hand-written: <repo-relative path> — template-misfit: <template> — <why>`.
            Otherwise write the tests the step names, and only tests: they state the behaviour the step adds, so they
            must fail now because that behaviour is missing (a compile error for a class the step creates counts).
            Run them and save the full output to $ARTIFACTS_DIR/red/step-<n>.log, exactly that name (no suffix, also when
            the step covers several modules or a resumed run comes back to it). The red log must show only the missing
            behaviour: a failure to resolve a dependency, or a compile error outside the types this step creates, proves
            nothing, so fix the build and run again. If they pass already, they do not test the step: rewrite them.
            Commit the tests alone as `test(step <n>): <what they prove>`, ending the message with the trailer
            `Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>`. Every file under a test tree the step adds
            (a fixture, a test helper, a test script) goes in that test commit, never with code.
            The commit-msg hook checks each commit's shape (a Conventional subject; a test file goes with code only
            with a `Test fix:` line). When it refuses one, split or reword the commit and commit again; you may
            rewrite a commit not pushed yet for this, a pushed one never. Never skip the hook.
            Run every command in the foreground and wait for it; never start one in the background.
            Never hand a command its files through `$(find ...)` or `$(ls ...)`: on an empty list sed, grep, cat, awk,
            head and rg read stdin instead and hang to the 10-minute timeout. Use `find ... -exec <cmd> {} +`, or the
            Read or Grep tool.
            An `ANSWER:` line in the plan is the owner's answer to an earlier question: follow it.
            When you cannot go on without an answer, write one line `BLOCKED: <question>` at the end of the plan and
            stop. Otherwise do not edit the plan, except for a `Hand-written:` line.
        - id: tests-check
          depends_on: [write-tests]
          bash: |
            bash .archon/scripts/blocked-stop.sh "$ARTIFACTS_DIR" "$WORKFLOW_ID" &&
              node .archon/scripts/step-check.js "$ARTIFACTS_DIR" "$WORKFLOW_ID" test
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              n: { type: integer }
              side: { type: string, enum: [test, build] }
              missing: { type: array, items: { type: string } }
              scaffold: { type: array, items: { type: string } }
            required: [ok, n, side, missing, scaffold]
        - id: scaffold-build
          depends_on: [tests-check]
          when: "$tests-check.output.ok == 'true'"
          bash: |
            node .archon/scripts/scaffold-step.js "$ARTIFACTS_DIR" build \
              || echo "scaffold-step.js failed; the build agent renders the step's files itself" >&2
        - id: build-step
          depends_on: [tests-check, scaffold-build]
          when: "$tests-check.output.ok == 'true'"
          model: "@build"
          denied_tools: ["Bash(*--no-verify*)", "Bash(*commit -n *)", "Monitor"]
          skills: [clean-code, java, domain-modeling, validation-notification-result, domain-events,
                    usecase-orchestration, api-first-controller, domain-dto-mapper, persistence-repository,
                    jpa-entity-mapping, flyway-migrations, resilience4j, bean-config-di, exception-to-http,
                    conventional-commits, code-generation]
          mcp: { path: .archon/mcp/build-tools.json, optional: true }
          prompt: |
            Request: $ARGUMENTS
            Read $ARTIFACTS_DIR/plan.md and take the first step still marked `- [ ]`; n is its position among the
            plan's checkbox lines (the first checkbox is 1).
            If mcp__portal-api__* or mcp__codegraph__* tools are in your tool list (the ticket node's mcp-setup.sh
            readied them), use them before Read and Grep:
            - `where` for the controller line and the generated interface method of an operation;
            - `schema` for the fields a mapper or DTO needs;
            - `codegraph_callers` before you change a shared symbol.
            Grep stays the tool for text, config, logs and strings; without the tools, read as before.
            If $ARTIFACTS_DIR/skills-missing.md names `Build skills:`, this step was built without them: load each
            with the Skill tool first, check the step's code against them and fix what they change, then go on as
            below (when nothing changed, mark the step and commit nothing).
            If $ARTIFACTS_DIR/scaffold-missing.md says `build side`, this step left a file or a plan line the
            scaffold-check gate would refuse: do what it says for each one first, then go on as below.
            A step that pushes, opens the pull request or reads CI is done by later nodes of this workflow: do not do
            it, mark it `- [x] (done by the workflow's open-pr and ci nodes)` and commit nothing for it.
            A step marked `- [ ] (verify only)` has no tests: make the docs change it names, or run the one generator it
            names, and run no test suite and no gate (affected-check, tdd-check, mutation and review run later in this
            workflow); commit only the files that changed (if any), and mark it `- [x] (verify only) ...`.
            A step marked `- [ ] (pin only)` has its tests committed: run `AFFECTED_NO_SYNC=1
            AFFECTED_BASE="$(cat "$ARTIFACTS_DIR/step-base.sha")" bash .claude/scripts/affected-check.sh`, mark it
            `- [x] (pin only) ...` and commit nothing else.
            Otherwise the test agent has committed this step's failing tests. Load every skill on the step's `Build skills:`
            line with the Skill tool, plus code-generation, and no others. Scaffold first. The scaffold-build node has
            rendered this step's other `Scaffold:` lines: read $ARTIFACTS_DIR/scaffold-render/step-<n>-build.md (none
            there: every new file is yours, as below). A file it lists as rendered is its template's base case: fill in what the template leaves out with Edit; a failed
            line or an existing file is yours, as the report says. For every other new file the step
            needs, run `scripts/scaffold.sh --for <path>` before you write it. It names each template whose Target
            matches the path, with its variables and what it leaves out, and prints the command that renders it: render
            the base case with that command (put in the variables it leaves as <...>), then edit the file for the edge
            cases with Edit; never write a rendered file over whole (Write, `cat >`): scaffold-check counts that as written
            by hand, and the render, its variables and the read-back were tokens for nothing. A template that does not fit
            (placeholder variables, an enum where it renders a class) is not rendered at all: write the file by hand with
            the template-misfit line. scaffold-check fails the run on a source file written by hand that the plan does not name: when
            --for finds no template, add the line it prints, `Hand-written: <repo-relative path> — no-template: <shape>`,
            under the step in the plan; when the templates it finds do not fit what the file needs, write it by hand and
            add `Hand-written: <repo-relative path> — template-misfit: <template> — <why>`. Then write the code that makes the tests pass,
            without weakening them; when a test is wrong, fix it in the same commit and give the reason on a line
            `Test fix: <why>` in the message (tdd-check reports a test edit without one). While you work, run only the
            step's own tests. Then run `AFFECTED_NO_SYNC=1 AFFECTED_BASE="$(cat "$ARTIFACTS_DIR/step-base.sha")" bash
            .claude/scripts/affected-check.sh`: it runs every test this step's change touches (the diff since the
            step began), never the full suite (review checks the whole branch, CI runs the suite). When it passes, mark
            the step `- [x]` in the plan and commit the code, ending the message with the trailer
            `Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>`. A file under a test tree goes with code only
            with that `Test fix:` line. When the commit-msg hook refuses a commit, split or reword it and commit
            again; you may rewrite a commit not pushed yet for this, a pushed one never. Never skip the hook.
            Run every command in the foreground and wait for it; never start one in the background.
            Never hand a command its files through `$(find ...)` or `$(ls ...)`: on an empty list sed, grep, cat, awk,
            head and rg read stdin instead and hang to the 10-minute timeout. Use `find ... -exec <cmd> {} +`, or the
            Read or Grep tool.
            An `ANSWER:` line in the plan is the owner's answer to an earlier question: follow it.
            When you cannot go on without an answer, write one line `BLOCKED: <question>` at the end of the plan and
            stop.
        - id: step-check
          depends_on: [build-step]
          bash: |
            bash .archon/scripts/blocked-stop.sh "$ARTIFACTS_DIR" "$WORKFLOW_ID" &&
              node .archon/scripts/step-check.js "$ARTIFACTS_DIR" "$WORKFLOW_ID" build
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              n: { type: integer }
              side: { type: string, enum: [test, build] }
              missing: { type: array, items: { type: string } }
              scaffold: { type: array, items: { type: string } }
            required: [ok, n, side, missing, scaffold]

  # Skill gate (P2): the plan node loaded clean-architecture, and every skill on a step's `Test skills:` / `Build
  # skills:` line was loaded by that step's write-tests / build-step (the audit trail against the run's node times and
  # red/step-<n>.log). Writes $ARTIFACTS_DIR/skill-check.md.
  - id: skill-check
    depends_on: [implement]
    bash: |
      node .archon/scripts/skill-check.js "$ARTIFACTS_DIR" "$WORKFLOW_ID"

  # Scaffold gate (P2, owner decisions 2026-10-18 and 2026-10-23, docs/memory.md): every source file the branch added,
  # scaffolded (scripts/scaffold.sh rendered it) or written by hand. One by hand passes only when plan.md names it in a
  # form that holds for it: `Hand-written: <path> — no-template: <shape>` when no `## Scaffold` Target in docs/code-maps
  # matches the path, `Hand-written: <path> — template-misfit: <template> — <why>` when that template's does. A
  # `Hand-written:` line in neither form fails it too, and it fails closed (no merge base, no plan, no run log). Once it
  # passes, --follow-ups commits follow-ups on the branch (docs/follow-ups/agentic/script/): one per misfit template at
  # once, one per no-template shape from the third ticket that named it, none twice. Writes
  # $ARTIFACTS_DIR/scaffold-check.md; review reads it and pr-refresh copies it into the pull request.
  - id: scaffold-check
    depends_on: [skill-check]
    bash: |
      node .archon/scripts/scaffold-check.js "$ARTIFACTS_DIR" "$WORKFLOW_ID" "$BASE_BRANCH" --follow-ups

  # The commit review starts from (R13): its fixes are re-checked against this base, not the whole branch again.
  - id: review-base
    depends_on: [scaffold-check]
    bash: |
      git rev-parse HEAD > "$ARTIFACTS_DIR/review-base.sha" && echo "review-base: $(cut -c1-12 "$ARTIFACTS_DIR/review-base.sha")"

  # The branch-wide test run review reads (owner decision 2026-10-23, docs/memory.md): affected-check, with the mutation
  # gate on a changed main class of a domain, usecase or gateway module, run once by a script instead of by the review
  # agent. It never fails the node: a red run is the review's to read and fix.
  - id: review-tests
    depends_on: [review-base]
    timeout: 3600000
    bash: |
      AFFECTED_NO_SYNC=1 bash .claude/scripts/affected-check.sh > "$ARTIFACTS_DIR/review-tests.log" 2>&1
      echo "review-tests: affected-check exit $?, its output in review-tests.log"
  - id: review
    depends_on: [scaffold-check, review-base, review-tests]
    model: "@analyse"
    denied_tools: ["Bash(*--no-verify*)", "Bash(*commit -n *)", "Monitor"]
    mcp: { path: .archon/mcp/build-tools.json, optional: true }
    prompt: |
      Request: $ARGUMENTS
      Review all changes on this branch against $ARTIFACTS_DIR/plan.md, including that every behaviour has a test.
      If mcp__portal-api__* or mcp__codegraph__* tools are in your tool list (the ticket node's mcp-setup.sh
      readied them), use them before Read and Grep:
      - `codegraph_impact` on each changed symbol, for a caller the branch missed;
      - `usedBy` on a changed schema field, for an operation the branch missed;
      - `where` on each operation the branch built, for its status and its tests.
      Grep stays the tool for text, config, logs and strings; without the tools, read as before.
      Read $ARTIFACTS_DIR/review-tests.log: the review-tests node ran `AFFECTED_NO_SYNC=1 bash
      .claude/scripts/affected-check.sh` over the branch once, so do not run it again before you fix anything. For a
      changed main class of a domain, usecase or gateway module it ends with the mutation gate (PIT on those classes).
      A failing test in it is an issue.
      A green suite is not the verdict; check each of these and treat a miss as an issue:
      - Mutations: do not hand-mutate a main class of a domain, usecase or gateway module: PIT covers it. Take the
        mutation gate's result from that log: every `SURVIVED:` or `NO_COVERAGE:` line it prints is an issue (kill it
        with a test; an equivalent mutant goes in config/mutation-accepted.txt with its reason). Hand-mutate only what
        PIT does not cover, mainly the adapters: remove each guard line the branch adds there once, flip each new
        condition, shift each boundary by one. Batch the mutations of one Gradle module into one run of its tests
        (`./gradlew :<module>:test`, plus its `integrationTest`, `startupTest` or `resourceTest` when the tests that
        cover the lines are tagged for one) when they cannot hide each other: different methods, or different branches
        of one method; a red run names the failing tests, so split a batch only to tell which mutation one test
        caught. Never the whole suite. A mutation no test catches is an issue. Revert each mutation from git, file by
        file.
      - Claims: every comment, javadoc, doc line and the plan's own claims match what the code does. A claim stronger
        than the code is an issue: fix the code or narrow the claim.
      - Decisions: every row of `## Decisions → tests` and every line under `## Owner decisions` in the plan has a test
        that fails without it.
      - Write paths: every path that writes what the branch changes is covered, not only the one the plan traced.
      - Gates: a gate or a guard the branch adds fails closed when its input is missing or empty.
      - Scaffolding: the scaffold-check gate passed, and $ARTIFACTS_DIR/scaffold-check.md lists under "Named
        hand-written in the plan" every file written by hand with its plan line. For each template-misfit, check that
        the why holds (the template really does not fit what the file needs); for each no-template, check that the
        shape is the word for that kind of file, the one earlier plans used. A why or a shape that does not hold is an
        issue; when you fix one, delete in the same fix the follow-up the gate wrote for it (its `source.ref` names the
        template or shape) unless another file still bears it out. Name in the review what the template would have given, never re-render a file that exists.
      - Checks: every line under `## Checks for review` in the plan holds in that run's output.
      Fix every issue tests first: commit the test that shows the issue alone, then the fix (UD-21.f); a test file
      changed in a fix commit needs a `Test fix: <why>` line in its message. End each commit message with the trailer
      `Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>`. When the commit-msg hook refuses a commit, split or
      reword it; you may rewrite a commit not pushed yet for this, a pushed one never. Never skip the hook.
      When you fixed anything, run `AFFECTED_NO_SYNC=1 AFFECTED_BASE="$(cat "$ARTIFACTS_DIR/review-base.sha")" bash
      .claude/scripts/affected-check.sh` once more (the tests your fixes touch), never the full suite (owner decision
      2026-10-17; CI runs that). Run every command in the foreground and wait for it.

  # Deterministic test-first gate (P2): every built step has a red run, and every code commit follows a test commit.
  # The checked HEAD is kept, so `ready` checks again over the commits that came after (review and CI fixes).
  - id: tdd-check
    depends_on: [review]
    bash: |
      set -e
      bash .archon/scripts/tdd-check.sh "$ARTIFACTS_DIR" "$BASE_BRANCH"
      git rev-parse HEAD > "$ARTIFACTS_DIR/tdd-checked.sha"

  # The Groma architecture map (TASK-36), in a repo with groma/ only: a script commits a fresh scan; the model curates
  # only what that scan added and the repo's groma-check.sh still rejects. CI runs the same check, so it gates the merge.
  - id: map-scan
    depends_on: [tdd-check]
    bash: |
      bash .archon/scripts/groma-sync.sh
    output_format:
      type: object
      properties:
        curate: { type: boolean }
      required: [curate]

  - id: map-curate
    depends_on: [map-scan]
    when: "$map-scan.output.curate == 'true'"
    model: "@analyse"
    denied_tools: ["Bash(*--no-verify*)", "Bash(*commit -n *)"]
    prompt: |
      Request: $ARGUMENTS
      This branch changed the code, and a fresh Groma scan (already committed) put elements into the architecture map
      under groma/ that `bash .claude/scripts/groma-check.sh` rejects; run it to see which. Run `groma agent-instructions`
      and read the guides it names for structure, descriptions and relationships. Change groma/ only through the groma
      CLI, never by editing its files. Place each new element under the container it belongs to; combine it into the
      existing component with the same responsibility, or keep it as a component when its responsibility is new.
      Describe what is new or changed, and add relationships only where the source supports them. Leave the rest of the
      map as it is. Run the check again until it passes, then commit groma/ alone as `docs(groma): <what changed>`.

  - id: map-check
    depends_on: [map-scan, map-curate]
    trigger_rule: none_failed_min_one_success
    bash: |
      if [ -f .claude/scripts/groma-check.sh ]; then bash .claude/scripts/groma-check.sh; fi

  # Link the ticket to the map (TASK-36): its changed files and the elements that own them, so Groma shows the ticket on
  # the map while it is open. A container the ticket was planned on is dropped once a component under it is linked
  # (`dropped` lists those ids). The ticket is edited in the backlog checkout; close-out commits it with the ticket's Done.
  - id: map-links
    depends_on: [map-check]
    bash: |
      task=$ticket.output.task
      bash .archon/scripts/groma-links.sh "$task" "$BASE_BRANCH"
    output_format:
      type: object
      properties:
        files: { type: number }
        refs: { type: string }
        dropped: { type: string }
      required: [files, refs]

  # Rebase the branch onto the base before the pull request opens (TASK-45): parallel tickets append to the same files,
  # and a conflicting pull request gets no CI. docs/memory.md combines as a union. Always a rebase, never a merge of the
  # base (owner decision 2026-10-17): a pushed branch is force-pushed with a lease. A conflict does not fail the run: the
  # rebase is aborted, the pull request opens as a draft, and the GitHub agent resolves it in the auto-merge loop. A
  # rebase that left conflict markers in a local commit still fails here, so it is never pushed. A fetch that fails 3
  # times (exit 3) fails here too: it is no conflict, and the base was never looked at.
  - id: rebase-main
    depends_on: [map-links]
    bash: |
      before=$(git rev-parse HEAD)
      rc=0; bash .archon/scripts/rebase-main.sh "$BASE_BRANCH" || rc=$?
      [ "$rc" -eq 0 ] && exit 0
      [ "$rc" -ne 3 ] || exit 1
      [ "$(git rev-parse HEAD)" = "$before" ] || exit 1
      echo "The base conflicts with this branch: the GitHub agent resolves it before the merge." >&2
      echo '{"rebased": false, "pushed": false}'
    output_format:
      type: object
      properties:
        rebased: { type: boolean }
        pushed: { type: boolean }
      required: [rebased, pushed]

  # No review gate before the push. The run never merges: the delegator or the owner does (TASK-58).
  - id: pr-text
    depends_on: [rebase-main]
    model: "@build"
    prompt: |
      Request: $ARGUMENTS
      Write the pull request description for the changes on this branch to $ARTIFACTS_DIR/pr-body.md: what changed
      and why, the tests, and the Backlog ticket ($ticket.output.task) when there is one. When the plan has a
      `## Owner decisions` section, copy it into a section `## Decisions` word for word, each with who decided it
      (the owner, or the coordinator acting for the owner); never credit a decision to someone the record does not
      name. Leave a line `<!-- pr-refresh:start -->`, then `<!-- pr-refresh:end -->`, before `## Merge`: a
      script fills that block from the branch after every CI round. Then add a section
      `## Merge` saying that the delegator or the owner merges this pull request, never the build-feature workflow
      itself, once every requested review is given, no review requests changes, every review thread is resolved and CI
      on its head commit is green (owner decision 2026-10-18, docs/memory.md). A reviewer holds the merge by requesting
      changes. Do not write a line that starts with "STOP items": pr-refresh.sh writes that line into the block. End
      it with:

      🤖 Generated with [Claude Code](https://claude.com/claude-code)
      Do not push and do not open the pull request; return only the title.
    output_format:
      type: object
      properties:
        title: { type: string }
      required: [title]

  - id: open-pr
    depends_on: [pr-text]
    bash: |
      title=$pr-text.output.title
      bash .archon/scripts/open-pr.sh "$BASE_BRANCH" "$title" "$ARTIFACTS_DIR/pr-body.md"
    output_format:
      type: object
      properties:
        pr: { type: string }
        sha: { type: string }
      required: [pr, sha]

  # Local CI is the verdict for good (owner decisions D14, D21 of 2026-10-20): GitHub Actions runs nothing, so each CI
  # question is preceded by local-ci-run.sh, which runs CI here and posts its result on the commit.
  # A pull request is named with --head, the commit just pushed: seconds after a push GitHub still reports the old head
  # (TASK-59), and ci-by-sha.sh asks about the local HEAD, so both look at the same commit.
  - id: ci
    depends_on: [open-pr]
    timeout: 3600000
    bash: |
      pr=$open-pr.output.pr
      bash .archon/scripts/local-ci-run.sh "$pr" --head "$(git rev-parse HEAD)" || exit 1
      bash .archon/scripts/ci-by-sha.sh
    output_format: &ci_state
      type: object
      properties:
        state: { type: string, enum: [green, red, none, conflict] }
        sha: { type: string }
        detail: { type: string }
      required: [state, sha, detail]

  # A red run is triaged by a script before an agent works on it (CI plan C17, owner decision D5 of 2026-10-20):
  # red-triage.sh classifies each red job conflict, infra, flaky, main-state or own (unknown is own) and reruns a run
  # that is only infra or flaky once, its red jobs only. Only own and main-state reds go to ci-fix. Green after the
  # rerun goes on to ready; a conflict goes to ready, which rebases. Infra still red after its one rerun fails the run:
  # no agent fixes the machine; the delegator resumes it once that is fixed. A triage that cannot read the run counts
  # as own.
  - id: triage
    depends_on: [ci]
    when: "$ci.output.state == 'red'"
    timeout: 3600000
    bash: |
      pr=$open-pr.output.pr
      rc=0; out=$(bash .archon/scripts/red-triage.sh --pr "$pr" --base "$BASE_BRANCH" --report "$ARTIFACTS_DIR/red-triage.json" "$(git rev-parse HEAD)") || rc=$?
      case "$rc" in
        0) echo "$out" ;;
        3) echo "$out" >&2
           echo "CI is red on infrastructure only, also after its one rerun: no agent works on it. Fix the machine, then resume the run." >&2
           exit 1 ;;
        *) echo "red-triage could not triage the run: it counts as this branch's own red." >&2
           printf '{"class": "own", "sha": "%s", "rerun": "none", "jobs": "", "detail": "not triaged"}\n' "$(git rev-parse HEAD)" ;;
      esac
    output_format:
      type: object
      properties:
        class: { type: string, enum: [green, own, main-state, conflict] }
        sha: { type: string }
        rerun: { type: string }
        jobs: { type: string }
        detail: { type: string }
      required: [class, sha, rerun, jobs, detail]

  # Red => escalate to the debugger (P5): Opus diagnoses from the failing logs, Sonnet fixes, until CI on the new
  # HEAD is green. Exhausting the rounds fails the run; the pull request stays a draft. Each round's red is triaged
  # again (fix-ci), so a rerun-worthy red does not cost a diagnosis.
  - id: ci-fix
    depends_on: [triage]
    when: "$triage.output.class == 'own' || $triage.output.class == 'main-state'"
    loop_group:
      max_iterations: 3
      until_bash: bash .archon/scripts/ci-by-sha.sh --check
      # Failure recovery (D13, R11, plans/failure-recovery.md C4): red-head stops the round when main is red on a job
      # that is red on the head too (RED_FROM_MAIN: rebase once main is green, not a fix here); fix-made fails the
      # round when the fix agent made no commit (CI_FIX_NO_COMMIT). classify-failure.js matches both tokens. No node
      # of ci-fix may push to main or write to the main checkout (denied_tools).
      nodes:
        - id: red-head
          bash: |
            git rev-parse HEAD > "$ARTIFACTS_DIR/ci-fix-before.sha" || exit 1
            repo=$(gh repo view --json nameWithOwner -q .nameWithOwner)
            main=$(git rev-parse origin/@@KIT_BASE_BRANCH@@)
            m=$(bash .archon/scripts/local-ci-status.sh "$repo" "$main")
            h=$(bash .archon/scripts/local-ci-status.sh "$repo" "$(git rev-parse HEAD)")
            red() { printf '%s' "$1" | grep -oE 'local-ci/[A-Za-z0-9_.-]+=(failure|error)' | cut -d= -f1 | sort -u; }
            if [ "${m%% *}" = red ] && [ -n "$(comm -12 <(red "$m") <(red "$h"))" ]; then
              echo "RED_FROM_MAIN: main $main is red on a job that is red on the head too" >&2; exit 1
            fi
            echo '{"red_from_main": false}'
        - id: diagnose
          depends_on: [red-head]
          model: "@analyse"
          mcp: { path: .archon/mcp/build-tools.json, optional: true }
          denied_tools: ["Bash(*--no-verify*)", "Bash(*commit -n *)", "Bash(*commit-tickets*)", "Bash(*backlog task*)", "Bash(*sync-main*)", "Bash(*git push*@@KIT_BASE_BRANCH@@*)", "Bash(*git push*HEAD:@@KIT_BASE_BRANCH@@*)", "Bash(cd @@KIT_PROJECT_DIR@@ &&*)", "Bash(cd @@KIT_PROJECT_DIR@@;*)", "Bash(git -C @@KIT_PROJECT_DIR@@ *)"]
          prompt: |
            If mcp__portal-api__* or mcp__codegraph__* tools are in your tool list (the ticket node's mcp-setup.sh
            readied them), use them before Read and Grep:
            - `codegraph_callers` and `codegraph_callees` to walk from the failing test to its cause;
            - `codegraph_impact` to bound the suspects; `where` when the failing test is an HTTP test of an operation.
            Grep stays the tool for text, config, logs and strings; without the tools, read as before.
            CI is red for the HEAD commit of this branch. It ran locally: `bash .archon/scripts/local-ci-run.sh --logs`
            prints the folder with summary.txt and one <job>.log per job; read the failing job's log there.
            red-triage.sh classified the red jobs in $ARTIFACTS_DIR/red-triage.json (`jobs`: <job>=<class>). Infra
            and flaky reds never reach you: the script reran them. `main-state` means the same job is red on the
            base's tip too: the cause came in with the base, not with this branch's change; still make the smallest
            fix here, and say in the diagnosis that it is inherited.
            Write the root cause and the smallest fix to $ARTIFACTS_DIR/ci-diagnosis.md. Do not edit code.
            Start ci-diagnosis.md with one line `CAUSE: branch` or `CAUSE: main`.
        - id: fix
          depends_on: [diagnose]
          model: "@build"
          denied_tools: ["Bash(*--no-verify*)", "Bash(*commit -n *)", "Bash(*commit-tickets*)", "Bash(*backlog task*)", "Bash(*sync-main*)", "Bash(*git push*@@KIT_BASE_BRANCH@@*)", "Bash(*git push*HEAD:@@KIT_BASE_BRANCH@@*)", "Bash(cd @@KIT_PROJECT_DIR@@ &&*)", "Bash(cd @@KIT_PROJECT_DIR@@;*)", "Bash(git -C @@KIT_PROJECT_DIR@@ *)"]
          prompt: |
            Read $ARTIFACTS_DIR/ci-diagnosis.md and apply the fix, tests first: when the fix changes behaviour, commit
            the test that shows the failure alone, then the fix. Run the tests, commit, and `git push`.
        - id: fix-made
          depends_on: [fix]
          bash: |
            if [ "$(git rev-parse HEAD)" = "$(cat "$ARTIFACTS_DIR/ci-fix-before.sha" 2>/dev/null)" ]; then
              echo "CI_FIX_NO_COMMIT: the fix agent made no commit on $(git rev-parse --short HEAD)" >&2; exit 1
            fi
            echo '{"committed": true}'
        - id: fix-ci
          depends_on: [fix-made]
          timeout: 3600000
          bash: |
            pr=$open-pr.output.pr
            bash .archon/scripts/local-ci-run.sh "$pr" --head "$(git rev-parse HEAD)" || exit 1
            rc=0; bash .archon/scripts/red-triage.sh --pr "$pr" --base "$BASE_BRANCH" --report "$ARTIFACTS_DIR/red-triage.json" "$(git rev-parse HEAD)" >&2 || rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "CI is red on infrastructure only, also after its one rerun: no agent works on it. Fix the machine, then resume the run." >&2
              exit 1
            fi

  # Green CI by SHA marks the pull request ready. A pull request that conflicts with its base (main moved while CI ran)
  # is rebased onto the base and CI asked again; a conflict that stays, or a red run after that rebase, leaves it a draft
  # for the GitHub agent in the auto-merge loop. Before the pull request turns ready, the test-first gate runs again
  # over the commits since its first pass (review fixes, CI fixes), and the generated block of the body is refreshed.
  # A red or missing verdict names the failing check (ci-by-sha.sh's detail), so the log says what to fix.
  - id: ready
    depends_on: [ci, triage, ci-fix]
    trigger_rule: none_failed_min_one_success
    timeout: 7200000
    bash: |
      set -euo pipefail
      pr=$open-pr.output.pr
      bash .archon/scripts/local-ci-run.sh "$pr" --head "$(git rev-parse HEAD)"
      result=$(bash .archon/scripts/ci-by-sha.sh)
      case "$result" in
        *'"state": "conflict"'*)
          echo "$result"
          before=$(git rev-parse HEAD)
          bash .archon/scripts/rebase-main.sh "$BASE_BRANCH" || [ "$(git rev-parse HEAD)" = "$before" ]
          bash .archon/scripts/local-ci-run.sh "$pr" --head "$(git rev-parse HEAD)"
          result=$(bash .archon/scripts/ci-by-sha.sh) ;;
      esac
      echo "$result"
      detail=$(node -e 'try { console.log(JSON.parse(process.argv[1]).detail) } catch { console.log(process.argv[1]) }' "$result")
      case "$result" in
        *'"state": "green"'*)
          bash .archon/scripts/tdd-check.sh "$ARTIFACTS_DIR" "$BASE_BRANCH" --since "$(cat "$ARTIFACTS_DIR/tdd-checked.sha")"
          ARTIFACTS_DIR="$ARTIFACTS_DIR" bash .archon/scripts/pr-refresh.sh "$pr" "$BASE_BRANCH" "$ARTIFACTS_DIR/pr-body.md"
          gh pr ready "$pr" ;;
        *'"state": "conflict"'*) echo "The pull request still conflicts with $BASE_BRANCH: it stays a draft for the GitHub agent." >&2 ;;
        *'"state": "red"'*) echo "CI is red ($detail): it stays a draft for the GitHub agent." >&2 ;;
        *) echo "No CI verdict for this commit ($detail): the pull request stays a draft (P5)." >&2; exit 1 ;;
      esac

  # The run brings its pull request to ready; it never merges it (owner decision 2026-10-18, docs/memory.md, TASK-58:
  # the delegator or the owner merges). Its gate is a script (P2): auto-merge.sh --no-merge waits until every requested
  # review is given, no reviewer's latest review requests changes, every review thread is resolved and CI on the head
  # commit is green by SHA, then runs the last gates (the test-first check over the commits since its last pass, the
  # body refresh), marks a draft ready and answers "ready". A conflict or a red run comes back to the GitHub agent, which
  # fixes it and pushes; the gate then waits for CI on the new head again. A run that ends with no CI, a failing last
  # gate, or 6 rounds used fails here. workflow-contracts.test.sh fails any workflow that merges.
  # Runs that reach this gate together merge one by one (owner decision 2026-10-18, docs/memory.md, TASK-56):
  # merge-turn.sh queues the pull request and waits for its turn, first come first merged unless the delegator orders
  # them otherwise. At its turn a pull request behind its base answers "behind": rebase-behind.sh rebases it onto the
  # base, force-pushes it with a lease and runs CI on the new head (CI plan C15, owner decisions D7, D8 of 2026-10-20);
  # only when that rebase conflicts or is refused does the "behind" answer go to the GitHub agent. Base commits that
  # change only backlog/ files the pull request does not change do not count (TASK-73) until reuse is live; then behind
  # means rebase (`rebase-behind.sh --policy`). A red run on the head is triaged first (red-triage.sh, C17): a run that
  # its one rerun turns green goes through the gate again; an infra red still red after it fails the gate; only an own
  # or main-state red goes to the GitHub agent. ci-local.sh runs one local CI at a time. A ready
  # pull request keeps its turn until the delegator or the owner merges it, or the delegator drops it.
  - id: auto-merge
    depends_on: [ready]
    loop_group:
      max_iterations: 6
      until_bash: |
        state=$gate.output.state
        case "$state" in ready|merged|closed) exit 0 ;; *) exit 1 ;; esac
      nodes:
        - id: gate
          timeout: 1209600000
          bash: |
            export PR_URL=$open-pr.output.pr
            export RUN_DIR="$ARTIFACTS_DIR" BASE="$BASE_BRANCH"
            turn=0; behind=$(bash .archon/scripts/merge-turn.sh wait "$PR_URL") || turn=$?
            if [ "$turn" -eq 3 ]; then
              rb=0; bash .archon/scripts/rebase-behind.sh "$PR_URL" >&2 || rb=$?
              case "$rb" in 0|4) ;; *) echo "$behind"; exit 0 ;; esac
            elif [ "$turn" -ne 0 ]; then exit 1; fi
            bash .archon/scripts/local-ci-run.sh "$PR_URL" --head "$(git rev-parse HEAD)" || exit 1
            gate() { bash .archon/scripts/auto-merge.sh "$PR_URL" --no-merge --pre 'bash .archon/scripts/tdd-check.sh "$RUN_DIR" "$BASE" --since "$(cat "$RUN_DIR/tdd-checked.sha")" && ARTIFACTS_DIR="$RUN_DIR" bash .archon/scripts/pr-refresh.sh "$PR_URL" "$BASE" "$RUN_DIR/pr-body.md"'; }
            rc=0; result=$(gate) || rc=$?
            case "$result" in
              *'"state":"red"'*)
                t=0; bash .archon/scripts/red-triage.sh --pr "$PR_URL" --base "$BASE" --report "$RUN_DIR/red-triage.json" "$(git rev-parse HEAD)" >&2 || t=$?
                if [ "$t" -eq 3 ]; then
                  echo "CI is red on infrastructure only, also after its one rerun: no agent works on it. Fix the machine, then resume the run." >&2
                  exit 1
                fi
                if grep -q '"class":"green"' "$RUN_DIR/red-triage.json" 2>/dev/null; then rc=0; result=$(gate) || rc=$?; fi ;;
            esac
            echo "$result"
            exit "$rc"
          output_format:
            type: object
            properties:
              state: { type: string, enum: [ready, merged, closed, conflict, red, behind] }
              sha: { type: string }
              detail: { type: string }
            required: [state, sha, detail]
        - id: github-agent
          depends_on: [gate]
          when: "$gate.output.state == 'conflict' || $gate.output.state == 'red' || $gate.output.state == 'behind'"
          model: "@analyse"
          denied_tools: ["Bash(*--no-verify*)", "Bash(*commit -n *)", "Bash(*commit-tickets*)", "Bash(*backlog task*)", "Bash(*sync-main*)", "Bash(*git push*@@KIT_BASE_BRANCH@@*)", "Bash(*git push*HEAD:@@KIT_BASE_BRANCH@@*)", "Bash(cd @@KIT_PROJECT_DIR@@ &&*)", "Bash(cd @@KIT_PROJECT_DIR@@;*)", "Bash(git -C @@KIT_PROJECT_DIR@@ *)"]
          prompt: |
            Request: $ARGUMENTS
            You are the GitHub agent. Use the Agent tool with the `github-agent` subagent for this job; when subagents
            are not available, read .claude/agents/github-agent.md and follow it yourself, its allowlist included.
            Pull request $open-pr.output.pr, head $gate.output.sha, base $BASE_BRANCH: $gate.output.state.
            $gate.output.detail
            - conflict: resolve it as its "Resolving merge conflicts" section says: rebase this branch onto
              origin/$BASE_BRANCH (never merge the base in), keep both intents in every conflicting commit, take the
              base's version of generated files and regenerate them, leave no conflict markers, and run the tests.
            - behind: it is this pull request's turn to merge, and another one merged into the base first.
              rebase-behind.sh already tried the rebase and could not finish it (a conflict, or it refused: see the
              gate's log). Rebase this branch onto origin/$BASE_BRANCH as for a conflict, run the tests and push: CI
              then runs on the new head, against the base as it is now.
            - red: CI ran locally: `bash .archon/scripts/local-ci-run.sh --logs $gate.output.sha` prints the folder
              with summary.txt and one <job>.log per job. GitHub Actions runs nothing (owner decisions D14, D21), so
              there are no Actions runs to read: when the folder is missing, the local-ci/<job> statuses on
              $gate.output.sha (`gh pr view $open-pr.output.pr --json statusCheckRollup`) are all there is.
              $ARTIFACTS_DIR/red-triage.json has red-triage.sh's class per red job: infra and flaky reds were rerun by
              the script and never reach you; `main-state` means the same job is red on the base's tip too. Fix the
              cause tests first: when the fix changes behaviour, commit the test that shows the failure alone, then the
              fix. Never weaken or skip a test to turn CI green.
            Commit with the trailer `Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>`. Push with the gh-git-ops
            push.sh script; after a rebase push this run's own branch with force-push.sh (--force-with-lease, approved
            in advance for this workflow, owner decision 2026-10-17). Never force-push or touch the base branch, and
            never merge the pull request (only the delegator or the owner merges it, owner decision 2026-10-18). When the intent
            of the two sides is unclear, run `git rebase --abort`, and write the hunks and the options to $ARTIFACTS_DIR/merge-blocked.md and end with
            `BLOCKED: <question>`: the run then fails at the end of its rounds with the pull request open.

  # After the merge the ticket is closed out: finalize it in Backlog, commit and push its Backlog files, delete the run's
  # own branch and worktree (the merge by the delegator or the owner is the approval for that). A pull request closed
  # without a merge ends the run here; a merge whose head SHA is not green fails it before anything changes.
  # wait-merge.sh waits here, up to 14 days, for the delegator or the owner to merge the ready pull request. The run is
  # still running then, so `archon workflow wait` does not return: with RUN_ID it lists the run as ready for the
  # delegator's `ready-runs.sh wait` (TASK-69).
  - id: merged
    depends_on: [auto-merge]
    timeout: 1209600000
    bash: |
      pr=$open-pr.output.pr
      RUN_ID=$WORKFLOW_ID bash .archon/scripts/wait-merge.sh "$pr"
    output_format:
      type: object
      properties:
        state: { type: string, enum: [merged, closed] }
        merge: { type: string }
        head: { type: string }
        branch: { type: string }
        ci: { type: string }
        backlog: { type: string }
      required: [state, merge, head, branch, ci, backlog]

  # CI on the merge commit itself (post-merge criteria read it), by SHA (P5). Every merge commit gets its own local CI
  # run and statuses (main-ci.sh, CI plan C13): it never answers from the head's statuses, also when the trees match;
  # reusing a green job of the same inputs is ci-local.sh's planner's call (D2: shadow until the owner turns it live),
  # and shows as a "reused from <sha>" status of the merge commit's own. A merge commit whose tree is exactly the tree
  # the head's last green run tested posts "reused from <head>; same tree" and runs nothing (2026-10-23). With --check
  # the node fails unless that CI is green: an unverified merge is never finalized or closed out (plan item C1).
  - id: main-ci
    depends_on: [merged]
    when: "$merged.output.state == 'merged'"
    timeout: 3600000
    bash: |
      merge=$merged.output.merge
      head=$merged.output.head
      bash .archon/scripts/main-ci.sh --check "$merge" "$head"
    output_format: *ci_state

  # The ticket's modified files come from the merged pull request, never from the model's memory of the run (P2).
  - id: ticket-files
    depends_on: [main-ci]
    bash: |
      task=$ticket.output.task
      pr=$open-pr.output.pr
      home=$merged.output.backlog
      if [ -z "$task" ]; then echo "No ticket: no modified files to set."; exit 0; fi
      bash .archon/scripts/ticket-files.sh "$task" "$pr" "$home"

  - id: finalize
    depends_on: [ticket-files]
    when: "$merged.output.state == 'merged'"
    model: "@build"
    prompt: |
      Pull request $open-pr.output.pr was merged as $merged.output.merge; CI on its head $merged.output.head is green.
      CI on the merge commit is $main-ci.output.state ($main-ci.output.detail): cite it for any criterion that holds
      only after the merge, and leave such a criterion unchecked when it is not green. The ticket's modified files
      are already set from the pull request; do not change them.
      Backlog ticket: $ticket.output.task. When it is empty there is no ticket: change nothing and return close=true.
      Otherwise finalize the ticket. Run every backlog command with BACKLOG_CWD=$merged.output.backlog, change Backlog
      only through the backlog CLI, and commit nothing: the close-out node commits.
      1. Read `backlog instructions task-finalization` and `backlog task view <ticket> --plain`.
      2. Check each acceptance criterion and Definition of Done item only on evidence: the merged code and tests,
         and local CI on the head SHA (its local-ci/<job> statuses; `bash .archon/scripts/local-ci-run.sh --logs
         <head>` prints the folder with summary.txt and each job's log). Check an item
         that does not apply, with its reason in the notes as `DoD #n N/A: <reason>`. The run never paused for a
         STOP approval (owner decision 2026-10-17, docs/memory.md): the review is the workflow's review node plus every
         GitHub review given on pull request $open-pr.output.pr, and the merge $merged.output.merge was done by the
         delegator or the owner after CI on its head was green, never by this run (owner decision 2026-10-18). Cite
         those for the items on review and on STOP approval, and name the STOP items the pull request's
         `STOP items touched:` line lists.
      3. Append the evidence to the implementation notes, write a final summary naming it (pull request, merge
         commit, CI run and SHA), and set the status Done.
      4. When the ticket has a parent and every sub-ticket of that parent is now Done, close the parent the same way.
      5. When an item has no evidence, leave it unchecked and the status unchanged, explain it in the notes, and
         return close=false: the run stops before anything is committed or deleted.
      Do not create or start follow-up tickets; name them in the notes.
    output_format:
      type: object
      properties:
        close: { type: boolean }
      required: [close]

  # Close-out also writes the ticket's token and cost report and its agent report (tools, skills, instruction files,
  # programs, subagents, tokens per agent) to docs/tokenomics/ and commits them (TASK-41, a script: P2).
  - id: close-out
    depends_on: [finalize]
    when: "$finalize.output.close == 'true'"
    bash: |
      task=$ticket.output.task
      pr=$open-pr.output.pr
      home=$merged.output.backlog
      bash .archon/scripts/close-out.sh "$task" "$pr" "$home"
    output_format:
      type: object
      properties:
        backlog: { type: string }
        branch: { type: string }
        worktree: { type: string }
      required: [backlog, branch, worktree]

