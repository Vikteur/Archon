            it says for each file it names, run the tests again into $ARTIFACTS_DIR/red/step-<n>.log, commit, and stop.
            When it says `build side`, the tests stand: change nothing and stop.
            A step that pushes, opens the pull request or reads CI is done by later nodes of this workflow: write
            nothing for it and stop.
            A step marked `- [ ] (verify only)` adds no behaviour: write nothing for it and stop.
            A step marked `- [ ] (pin only)` pins behaviour that exists: write its tests, then for each `Pin:` line under
            it break the code once (remove the guard or flip the condition the test pins), run the tests, append that
            red output to $ARTIFACTS_DIR/red/step-<n>.log after a line `MUTATION: <file>: <what you broke>`, and revert
            the code from git, that file only, before the next one. Commit only the tests.
            Load every skill on the step's `Test skills:` line with the skill tool, and code-generation. Scaffold
            first. The scaffold-tests node has rendered this step's `Scaffold:` lines for test trees: read
            $ARTIFACTS_DIR/scaffold-render/step-<n>-test.md (none there: every new test file is yours, as below). A
            file it lists as rendered is its template's base case:
            make it the step's test with Edit and commit it with the other tests, or delete it when the step does not
            need it; a failed line or an existing file is yours, as the report says. For every other new file under a
            test tree the step needs (a test class, a Mother, a fixture), run
            `scripts/scaffold.sh --test --for <path>` before you write it. It names each template whose Target matches
