        - id: write-tests
          depends_on: [scaffold-tests]
          model: "@build-copilot"
          retry: { max_attempts: 3, delay_ms: 5000, on_error: transient }
          idle_timeout: 1200000
          effort: medium
          # Commits go through the commit-shape hook: no agent of a run skips it, and no background command or
          # Monitor stands in for a foreground run.
          denied_tools: ["Bash(*--no-verify*)", "Bash(*commit -n *)", "Monitor"]
          skills:
            - tdd-loop
            - jvm-testing # profile java@@KIT_IF_PROFILE_JAVA@@
            - object-mother-builders # profile java@@KIT_IF_PROFILE_JAVA@@
            - usecase-bdd-spec # profile java@@KIT_IF_PROFILE_JAVA@@
            - testcontainers # profile java-spring@@KIT_IF_PROFILE_JAVA_SPRING@@
            - archunit-fitness # profile java@@KIT_IF_PROFILE_JAVA@@
            - domain-to-dto-mapper-tests # profile java@@KIT_IF_PROFILE_JAVA@@
            - code-generation
          mcp: { path: .archon/mcp/build-tools.json, optional: true }
          prompt: |
            Request: $ARGUMENTS
            You are the test agent: you write tests, never production code.
            Look code and the contract up with the CLIs first, from the repo root; the MCP tool of the same name answers
            the same when it is in your tool list:
            - `codegraph explore "<names or a question>"` for an area, its source and the calls between; `codegraph node`,
              `callers`, `callees` or `impact <symbol>` for one symbol (mcp__codegraph__codegraph_<name>);
            - `node scripts/contract-mcp/cli.mjs search|read|where|schema|usedBy <args>` for the contract, never a Read of@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
              contract/ (mcp__@@KIT_CONTRACT_SERVER_NAME@@__<name>);@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
            - here: `codegraph callers <class>` for the existing tests of a class;
            - here: `schema` for the fields a mother, fixture or request body needs; `where` for an operation's existing@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
              HTTP tests and unit tests, to extend them instead of writing a second one.@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
            Grep stays the tool for text, config, logs and strings; read a file only for what these leave out.
            Read files with `view`, folders with `glob` and text with `grep`, one call each; never `cat`, `ls` or `echo` in the shell (the fence denies them).
            Read $ARTIFACTS_DIR/step.md: the step to work on, cut from plan.md (its n, its lines, the steps folded into it,
            the owner decisions and the plan's answers). Read plan.md only for what step.md leaves out, and mark the step
            in plan.md. No step.md: read $ARTIFACTS_DIR/plan.md and take the first step still marked `- [ ]`; n is its
            position among the plan's checkbox lines (the first checkbox is 1).
            If $ARTIFACTS_DIR/skills-missing.md exists, read it first: an agent of this step never loaded the skills
            it names. When it names `Test skills:`, load each with the skill tool, check this step's tests against
            them, fix what they change, run the tests again into $ARTIFACTS_DIR/red/step-<n>.log and commit any change
