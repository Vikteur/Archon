            and `git log --format=%s "$(cat "$ARTIFACTS_DIR/step-base.sha")"..HEAD`. On a `(pin only)` step, a change to a
            file outside a test tree that no commit holds is a mutation an earlier attempt did not revert: revert it from git,
            that file only, before anything else. When this step's `test(step <n>): ...` commit is there already, its tests
