            The commit-msg hook checks each commit's shape (a Conventional subject; a test file goes with code only
            with a `Test fix:` line). When it refuses one, split or reword the commit and commit again; you may
            rewrite a commit not pushed yet for this, a pushed one never. Never skip the hook.
            Run every command in the foreground and wait for it; never start one in the background.
            Never hand a command its files through `$(find ...)` or `$(ls ...)`: on an empty list sed, grep, cat, awk,
            head and rg read stdin instead and hang to the 10-minute timeout. Use `find ... -exec <cmd> {} +`, or the
            Read or Grep tool.
            An `ANSWER:` line in the plan is the owner's answer to an earlier question: follow it.
            When you cannot go on without an answer, write one line `BLOCKED: <question>` at the end of the plan and
            stop. Otherwise do not edit the plan, except for a `Hand-written:` line.
        - id: tests-check
          depends_on: [write-tests]
          bash: |
            bash .archon/scripts/blocked-stop.sh "$ARTIFACTS_DIR" "$WORKFLOW_ID" &&
              node .archon/scripts/copilot-audit.js "$WORKFLOW_ID" && node .archon/scripts/step-check.js "$ARTIFACTS_DIR" "$WORKFLOW_ID" test
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              n: { type: integer }
              side: { type: string, enum: [test, build] }
              missing: { type: array, items: { type: string } }
              scaffold: { type: array, items: { type: string } }
            required: [ok, n, side, missing, scaffold]
        - id: scaffold-build
          depends_on: [tests-check]
          when: "$tests-check.output.ok == 'true'"
          bash: |
            node .archon/scripts/scaffold-step.js "$ARTIFACTS_DIR" build \
              || echo "scaffold-step.js failed; the build agent renders the step's files itself" >&2
            # The step again: the test agent may have marked a step or added a line since step-base cut it.
