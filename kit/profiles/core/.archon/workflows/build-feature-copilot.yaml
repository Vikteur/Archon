            - clean-code
            - java # profile java@@KIT_IF_PROFILE_JAVA@@
            - domain-modeling # profile java@@KIT_IF_PROFILE_JAVA@@
            - validation-notification-result # profile java@@KIT_IF_PROFILE_JAVA@@
            - domain-events # profile java@@KIT_IF_PROFILE_JAVA@@
            - usecase-orchestration # profile java@@KIT_IF_PROFILE_JAVA@@
            - api-first-controller # profile java-spring@@KIT_IF_PROFILE_JAVA_SPRING@@
            - domain-dto-mapper # profile java@@KIT_IF_PROFILE_JAVA@@
            - persistence-repository # profile java-spring@@KIT_IF_PROFILE_JAVA_SPRING@@
            - jpa-entity-mapping # profile java@@KIT_IF_PROFILE_JAVA@@
            - flyway-migrations # profile java@@KIT_IF_PROFILE_JAVA@@
            - resilience4j # profile java-spring@@KIT_IF_PROFILE_JAVA_SPRING@@
            - bean-config-di # profile java-spring@@KIT_IF_PROFILE_JAVA_SPRING@@
            - exception-to-http # profile java-spring@@KIT_IF_PROFILE_JAVA_SPRING@@
            - conventional-commits
            - code-generation
          mcp: { path: .archon/mcp/build-tools.json, optional: true }
          prompt: |
            Request: $ARGUMENTS
            Read files with `view`, folders with `glob` and text with `grep`, one call each; never `cat`, `ls` or `echo` in the shell (the fence denies them).
            Read $ARTIFACTS_DIR/step.md: the step to work on, cut from plan.md (its n, its lines, the steps folded into it,
            the owner decisions and the plan's answers). Read plan.md only for what step.md leaves out, and mark the step
            in plan.md. No step.md: read $ARTIFACTS_DIR/plan.md and take the first step still marked `- [ ]`; n is its
            position among the plan's checkbox lines (the first checkbox is 1).
            Look code and the contract up with the CLIs first, from the repo root; the MCP tool of the same name answers
            the same when it is in your tool list:
            - `codegraph explore "<names or a question>"` for an area, its source and the calls between; `codegraph node`,
              `callers`, `callees` or `impact <symbol>` for one symbol (mcp__codegraph__codegraph_<name>);
            - `node scripts/contract-mcp/cli.mjs search|read|where|schema|usedBy <args>` for the contract, never a Read of@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
              contract/ (mcp__@@KIT_CONTRACT_SERVER_NAME@@__<name>);@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
            - here: `codegraph callers <symbol>` before you change a shared symbol;
