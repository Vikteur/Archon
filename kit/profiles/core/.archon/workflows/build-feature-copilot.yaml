            [ -f "$pf" ] || { echo "step-base: no plan at $pf" >&2; exit 1; }
            n=$(grep -E '^[[:space:]]*- \[[ xX]\]' "$pf" | grep -nE '^[[:space:]]*- \[ \]' | head -1 | cut -d: -f1)
            [ -n "$n" ] || { echo "step-base: no open step"; exit 0; }
            keep="$ARTIFACTS_DIR/step-base-${n}.sha"
