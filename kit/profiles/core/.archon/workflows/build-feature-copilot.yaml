          bash: |
            bash .archon/scripts/blocked-stop.sh "$ARTIFACTS_DIR" "$WORKFLOW_ID" &&
              node .archon/scripts/copilot-audit.js "$WORKFLOW_ID" && node .archon/scripts/step-check.js "$ARTIFACTS_DIR" "$WORKFLOW_ID" build
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              n: { type: integer }
              side: { type: string, enum: [test, build] }
              missing: { type: array, items: { type: string } }
              scaffold: { type: array, items: { type: string } }
            required: [ok, n, side, missing, scaffold]

  # Skill gate (P2): the plan node loaded clean-architecture, and every skill on a step's `Test skills:` / `Build
  # skills:` line was loaded by that step's write-tests / build-step (the audit trail against the run's node times and
  # red/step-<n>.log). Writes $ARTIFACTS_DIR/skill-check.md.
  - id: skill-check
    depends_on: [implement]
    bash: |
      node .archon/scripts/copilot-audit.js "$WORKFLOW_ID" && node .archon/scripts/skill-check.js "$ARTIFACTS_DIR" "$WORKFLOW_ID"

  # Scaffold gate (P2, owner decisions 2026-10-18 and 2026-10-23, docs/memory.md): every source file the branch added,
  # scaffolded (scripts/scaffold.sh rendered it) or written by hand. One by hand passes only when plan.md names it in a
  # form that holds for it: `Hand-written: <path> — no-template: <shape>` when no `## Scaffold` Target in docs/code-maps
  # matches the path, `Hand-written: <path> — template-misfit: <template> — <why>` when that template's does. A
  # `Hand-written:` line in neither form fails it too, and it fails closed (no merge base, no plan, no run log). Once it
  # passes, --follow-ups commits follow-ups on the branch (docs/follow-ups/agentic/script/): one per misfit template at
  # once, one per no-template shape from the third ticket that named it, none twice. Writes
  # $ARTIFACTS_DIR/scaffold-check.md; review reads it and pr-refresh copies it into the pull request.
  - id: scaffold-check
    depends_on: [skill-check, review-tests]
    bash: |
      node .archon/scripts/scaffold-check.js "$ARTIFACTS_DIR" "$WORKFLOW_ID" "$BASE_BRANCH" --follow-ups

  # The commit review starts from: its fixes are re-checked against this base, not the whole branch again.
  - id: review-base
    depends_on: [scaffold-check]
    bash: |
      git rev-parse HEAD > "$ARTIFACTS_DIR/review-base.sha" && echo "review-base: $(cut -c1-12 "$ARTIFACTS_DIR/review-base.sha")"

  # The branch-wide test run review reads (owner decision 2026-10-23, docs/memory.md): affected-check, run once by a
  # script instead of by the review agent. It never fails the node: a red run is the review's to read and fix.
  # It runs beside skill-check, right after the loop: neither writes to git, and scaffold-check, whose follow-ups
  # commit, waits for both.
  - id: review-tests
    depends_on: [implement]
    timeout: 3600000
    bash: |
      AFFECTED_NO_SYNC=1 bash .claude/scripts/affected-check.sh > "$ARTIFACTS_DIR/review-tests-full.log" 2>&1
      rc=$?
      # The review reads the failure lines and the last 200 lines, not the whole run (log-cap.sh).
      bash .archon/scripts/log-cap.sh "$ARTIFACTS_DIR/review-tests-full.log" "$ARTIFACTS_DIR/review-tests.log" \
        || cp "$ARTIFACTS_DIR/review-tests-full.log" "$ARTIFACTS_DIR/review-tests.log"
      echo "review-tests: affected-check exit $rc, its output in review-tests.log (the whole run in review-tests-full.log)"
  - id: review
    depends_on: [scaffold-check, review-base, review-tests]
    model: "@analyse-copilot"
    retry: { max_attempts: 3, delay_ms: 5000, on_error: transient }
    idle_timeout: 1200000
    effort: high
    denied_tools: ["Bash(*--no-verify*)", "Bash(*commit -n *)", "Monitor"]
    mcp: { path: .archon/mcp/build-tools.json, optional: true }
    prompt: |
      Request: $ARGUMENTS
      Review all changes on this branch against $ARTIFACTS_DIR/plan.md, including that every behaviour has a test.
      Look code and the contract up with the CLIs first, from the repo root; the MCP tool of the same name answers
      the same when it is in your tool list:
      - `codegraph explore "<names or a question>"` for an area, its source and the calls between; `codegraph node`,
        `callers`, `callees` or `impact <symbol>` for one symbol (mcp__codegraph__codegraph_<name>);
      - `node scripts/contract-mcp/cli.mjs search|read|where|schema|usedBy <args>` for the contract, never a Read of@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
        contract/ (mcp__@@KIT_CONTRACT_SERVER_NAME@@__<name>);@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
      - here: `codegraph impact` on each changed symbol, for a caller the branch missed;
      - here: `usedBy` on a changed schema field, for an operation the branch missed; `where` on each operation the@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
        branch built, for its status and its tests.@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
      Grep stays the tool for text, config, logs and strings; read a file only for what these leave out.
      This node may run again after a transient failure; the next attempt starts on the worktree as the last one left
      it. So first run `git status` and `git log --oneline "$(cat "$ARTIFACTS_DIR/review-base.sha")"..HEAD`. Revert every
      change no commit holds from git, file by file, before you mutate anything: it is a mutation an earlier attempt did
      not revert, or a fix it did not commit (make that fix again, tests first). The commits listed are an earlier
      attempt's fixes: keep them, never commit a fix twice, and review on from there.
      Read files with `view`, folders with `glob` and text with `grep`, one call each; never `cat`, `ls` or `echo` in the shell (the fence denies them).
      Read $ARTIFACTS_DIR/review-tests.log: the review-tests node ran `AFFECTED_NO_SYNC=1 bash
      .claude/scripts/affected-check.sh` over the branch once, so do not run it again before you fix anything.
      A long run is cut to its failure lines and its last 200 lines; grep $ARTIFACTS_DIR/review-tests-full.log for
      more. A failing test in it is an issue.
      A green suite is not the verdict; check each of these and treat a miss as an issue:
      - Mutations: hand-mutate what the branch adds: remove each guard line it adds once, flip each new condition,
        shift each boundary by one. Batch the mutations of one Gradle module into one run of its tests
        (`./gradlew :<module>:test`, plus its `integrationTest` or `resourceTest` when the tests that
        cover the lines are tagged for one) when they cannot hide each other: different methods, or different branches
        of one method; a red run names the failing tests, so split a batch only to tell which mutation one test
        caught. Never the whole suite. A mutation no test catches is an issue. Revert each mutation from git, file by
        file.
      - Claims: every comment, javadoc, doc line and the plan's own claims match what the code does. A claim stronger
        than the code is an issue: fix the code or narrow the claim.
      - Decisions: every row of `## Decisions → tests` and every line under `## Owner decisions` in the plan has a test
        that fails without it.
      - Write paths: every path that writes what the branch changes is covered, not only the one the plan traced.
      - Gates: a gate or a guard the branch adds fails closed when its input is missing or empty.
      - Scaffolding: the scaffold-check gate passed, and $ARTIFACTS_DIR/scaffold-check.md lists under "Named
        hand-written in the plan" every file written by hand with its plan line. For each template-misfit, check that
        the why holds (the template really does not fit what the file needs); for each no-template, check that the
        shape is the word for that kind of file, the one earlier plans used. A why or a shape that does not hold is an
        issue; when you fix one, delete in the same fix the follow-up the gate wrote for it (its `source.ref` names the
        template or shape) unless another file still bears it out. Name in the review what the template would have given, never re-render a file that exists.
      - Checks: every line under `## Checks for review` in the plan holds in that run's output.
      Fix every issue tests first: commit the test that shows the issue alone, then the fix; a test file
      changed in a fix commit needs a `Test fix: <why>` line in its message. End each commit message with the trailer
      `Co-Authored-By: GitHub Copilot <noreply@github.com>`. When the commit-msg hook refuses a commit, split or
      reword it; you may rewrite a commit not pushed yet for this, a pushed one never. Never skip the hook.
      When you fixed anything, run `AFFECTED_NO_SYNC=1 AFFECTED_BASE="$(cat "$ARTIFACTS_DIR/review-base.sha")" bash
      .claude/scripts/affected-check.sh` once more (the tests your fixes touch), never the full suite (owner decision
      2026-10-17; CI runs that). Run every command in the foreground and wait for it.

  # The review's own commits pass the scaffold gate the loop's commits passed: when review committed anything after
  # review-base, scaffold-check.js runs again over the branch, with the review's session in the audit trail and without
  # --follow-ups, so no follow-up is committed twice; it rewrites scaffold-check.md for pr-refresh. Nothing committed:
  # nothing to check. (The skills gate names no skill for review, so it has nothing new to check here.)
  - id: review-check
    depends_on: [review]
    bash: |
      base=$(cat "$ARTIFACTS_DIR/review-base.sha" 2>/dev/null) || { echo "review-check: no review-base.sha" >&2; exit 1; }
      if [ "$(git rev-parse HEAD)" = "$base" ]; then echo "review-check: review made no commit"; exit 0; fi
      node .archon/scripts/copilot-audit.js "$WORKFLOW_ID" && node .archon/scripts/scaffold-check.js "$ARTIFACTS_DIR" "$WORKFLOW_ID" "$BASE_BRANCH"

  # Deterministic test-first gate (P2): every built step has a red run, and every code commit follows a test commit.
  # The checked HEAD is kept, so `ready` checks again over the commits that came after (review and CI fixes).
  - id: tdd-check
    depends_on: [review-check]
    bash: |
      set -e
      bash .archon/scripts/tdd-check.sh "$ARTIFACTS_DIR" "$BASE_BRANCH"
      git rev-parse HEAD > "$ARTIFACTS_DIR/tdd-checked.sha"

  # Rebase the branch onto the base before the pull request opens: parallel tickets append to the same files,
  # and a conflicting pull request gets no CI. docs/memory.md combines as a union. Always a rebase, never a merge of the
  # base (owner decision 2026-10-17): a pushed branch is force-pushed with a lease. A conflict does not fail the run: the
  # rebase is aborted, the pull request opens as a draft, and the ready node fails the run on it. A
  # rebase that left conflict markers in a local commit still fails here, so it is never pushed. A fetch that fails 3
  # times (exit 3) fails here too: it is no conflict, and the base was never looked at.
  - id: rebase-main
    depends_on: [tdd-check]
    timeout: 600000
    bash: |
      before=$(git rev-parse HEAD)
      rc=0; bash .archon/scripts/rebase-main.sh "$BASE_BRANCH" || rc=$?
      [ "$rc" -eq 0 ] && exit 0
      [ "$rc" -ne 3 ] || exit 1
      [ "$(git rev-parse HEAD)" = "$before" ] || exit 1
      echo "The base conflicts with this branch: the pull request opens as a draft." >&2
      echo '{"rebased": false, "pushed": false}'
    output_format:
      type: object
      properties:
        rebased: { type: boolean }
        pushed: { type: boolean }
      required: [rebased, pushed]

  # No review gate before the push. The run never merges: a team member does.
  - id: pr-text
    depends_on: [rebase-main]
    model: "@build-copilot"
    retry: { max_attempts: 3, delay_ms: 5000, on_error: transient }
    idle_timeout: 600000
    effort: low
    prompt: |
      Request: $ARGUMENTS
      Write the summary of the pull request for the changes on this branch to $ARTIFACTS_DIR/pr-summary.md: two to
      four sentences on what changed and why, plain text, no headings, and no line that starts with "STOP items".
      pr-body.sh builds the rest of the description from the branch (the ticket, the test commits, the merge section),
      and pr-refresh.sh adds the plan's owner decisions once CI is green. Do not push and do not open the pull request;
      return only the title.
    output_format:
      type: object
      properties:
        title: { type: string }
      required: [title]

  - id: open-pr
    depends_on: [pr-text]
    timeout: 300000
    bash: |
      title=$pr-text.output.title
      task=$ticket.output.task
      # The description is a template (pr-body.sh); the model wrote only the summary in pr-summary.md.
      bash .archon/scripts/pr-body.sh "$BASE_BRANCH" "$task" "$ARTIFACTS_DIR/pr-summary.md" \
        "$ARTIFACTS_DIR/pr-body.md" \
        && bash .archon/scripts/open-pr.sh "$BASE_BRANCH" "$title" "$ARTIFACTS_DIR/pr-body.md"
    output_format:
      type: object
      properties:
        pr: { type: string }
        sha: { type: string }
      required: [pr, sha]

  # Local CI is the verdict: GitHub Actions runs nothing, so each CI
  # question is preceded by local-ci-run.sh, which runs CI here and posts its result on the commit.
  # A pull request is named with --head, the commit just pushed: seconds after a push GitHub still reports the old head,
  # and ci-by-sha.sh asks about the local HEAD, so both look at the same commit.
  - id: ci
    depends_on: [open-pr]
    timeout: 3600000
    bash: |
      pr=$open-pr.output.pr
      bash .archon/scripts/local-ci-run.sh "$pr" --head "$(git rev-parse HEAD)" || exit 1
      bash .archon/scripts/ci-by-sha.sh
    output_format: &ci_state
      type: object
      properties:
        state: { type: string, enum: [green, red, none, conflict] }
        sha: { type: string }
        detail: { type: string }
      required: [state, sha, detail]

  # A red run is triaged by a script before an agent works on it:
  # red-triage.sh classifies each red job conflict, infra, flaky, main-state or own (unknown is own) and reruns a run
  # that is only infra or flaky once, its red jobs only. Only own and main-state reds go to ci-fix. Green after the
  # rerun goes on to ready; a conflict goes to ready, which rebases. Infra still red after its one rerun fails the run:
  # no agent fixes the machine; a person resumes it once that is fixed. A triage that cannot read the run counts
  # as own.
  - id: triage
    depends_on: [ci]
    when: "$ci.output.state == 'red'"
    timeout: 3600000
    bash: |
      pr=$open-pr.output.pr
      rc=0; out=$(bash .archon/scripts/red-triage.sh --pr "$pr" --base "$BASE_BRANCH" --report "$ARTIFACTS_DIR/red-triage.json" "$(git rev-parse HEAD)") || rc=$?
      case "$rc" in
        0) echo "$out" ;;
        3) echo "$out" >&2
           echo "CI is red on infrastructure only, also after its one rerun: no agent works on it. Fix the machine, then resume the run." >&2
           exit 1 ;;
        *) echo "red-triage could not triage the run: it counts as this branch's own red." >&2
           printf '{"class": "own", "sha": "%s", "rerun": "none", "jobs": "", "detail": "not triaged"}\n' "$(git rev-parse HEAD)" ;;
      esac
    output_format:
      type: object
      properties:
        class: { type: string, enum: [green, own, main-state, conflict] }
        sha: { type: string }
        rerun: { type: string }
        jobs: { type: string }
        detail: { type: string }
      required: [class, sha, rerun, jobs, detail]

  # Red => escalate to the debugger (P5): Opus diagnoses from the failing logs, Sonnet fixes, until CI on the new
  # HEAD is green. Exhausting the rounds fails the run; the pull request stays a draft. Each round's red is triaged
  # again (fix-ci), so a rerun-worthy red does not cost a diagnosis.
  - id: ci-fix
    depends_on: [triage]
    when: "$triage.output.class == 'own' || $triage.output.class == 'main-state'"
    loop_group:
      max_iterations: 3
      until_bash: bash .archon/scripts/ci-by-sha.sh --check
      # Failure recovery: red-head stops the round when main is red on a job
      # that is red on the head too (RED_FROM_MAIN: rebase once main is green, not a fix here); a main with no verdict
      # (none, pending, stale, superseded) is unknown, not "not from main", and the round goes on; fix-made fails the
      # round when the fix agent made no commit (CI_FIX_NO_COMMIT), and ends the run as blocked, with the diagnosis,
      # when that diagnosis says the red came in with the base (BLOCKED_NEEDS_PERSON). No node
      # of ci-fix may push to main or write to the main checkout (denied_tools).
      nodes:
        - id: red-head
          bash: |
            git rev-parse HEAD > "$ARTIFACTS_DIR/ci-fix-before.sha" || exit 1
            repo=$(gh repo view --json nameWithOwner -q .nameWithOwner)
            main=$(git rev-parse origin/@@KIT_BASE_BRANCH@@)
            m=$(bash .archon/scripts/local-ci-status.sh "$repo" "$main")
            h=$(bash .archon/scripts/local-ci-status.sh "$repo" "$(git rev-parse HEAD)")
            red() { printf '%s' "$1" | grep -oE 'local-ci/[A-Za-z0-9_.-]+=(failure|error)' | cut -d= -f1 | sort -u; }
            case "${m%% *}" in
              green|red) ;;
              *) echo "red-head: main $main has no CI verdict (${m%% *}): whether the red came from main is unknown" >&2
                 echo '{"red_from_main": "unknown"}'; exit 0 ;;
            esac
            if [ "${m%% *}" = red ] && [ -n "$(comm -12 <(red "$m") <(red "$h"))" ]; then
              echo "RED_FROM_MAIN: main $main is red on a job that is red on the head too" >&2; exit 1
            fi
            echo '{"red_from_main": false}'
        - id: diagnose
          depends_on: [red-head]
          model: "@analyse-copilot"
          retry: { max_attempts: 3, delay_ms: 5000, on_error: transient }
          idle_timeout: 600000
          effort: high
          mcp: { path: .archon/mcp/build-tools.json, optional: true }
          denied_tools: ["Bash(*--no-verify*)", "Bash(*commit -n *)", "Bash(*commit-tickets*)", "Bash(*backlog task*)", "Bash(*sync-main*)", "Bash(*git push*@@KIT_BASE_BRANCH@@*)", "Bash(*git push*HEAD:@@KIT_BASE_BRANCH@@*)", "Bash(cd @@KIT_PROJECT_DIR@@ &&*)", "Bash(cd @@KIT_PROJECT_DIR@@;*)", "Bash(git -C @@KIT_PROJECT_DIR@@ *)"]
          prompt: |
            Look code and the contract up with the CLIs first, from the repo root; the MCP tool of the same name answers
            the same when it is in your tool list:
            - `codegraph explore "<names or a question>"` for an area, its source and the calls between; `codegraph node`,
              `callers`, `callees` or `impact <symbol>` for one symbol (mcp__codegraph__codegraph_<name>);
            - `node scripts/contract-mcp/cli.mjs search|read|where|schema|usedBy <args>` for the contract, never a Read of@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
              contract/ (mcp__@@KIT_CONTRACT_SERVER_NAME@@__<name>);@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
            - here: `codegraph callers` and `codegraph callees` to walk from the failing test to its cause, `codegraph impact`
              to bound the suspects;
            - here: `where` when the failing test is an HTTP test of an operation.@@KIT_IF_PROFILE_OPENAPI_CONTRACT@@
            Grep stays the tool for text, config, logs and strings; read a file only for what these leave out.
            CI is red for the HEAD commit of this branch. It ran locally: `bash .archon/scripts/local-ci-run.sh --logs`
            prints the folder with summary.txt and one <job>.log per job; read the failing job's log there.
            red-triage.sh classified the red jobs in $ARTIFACTS_DIR/red-triage.json (`jobs`: <job>=<class>). Infra
            and flaky reds never reach you: the script reran them. `main-state` means the same job is red on the
            base's tip too: the cause came in with the base, not with this branch's change; still make the smallest
            fix here, and say in the diagnosis that it is inherited.
            Write the root cause and the smallest fix to $ARTIFACTS_DIR/ci-diagnosis.md. Do not edit code.
            Start ci-diagnosis.md with one line `CAUSE: branch` or `CAUSE: main`.
        - id: fix
          depends_on: [diagnose]
          model: "@build-copilot"
          retry: { max_attempts: 3, delay_ms: 5000, on_error: transient }
          idle_timeout: 1200000
          effort: medium
          denied_tools: ["Bash(*--no-verify*)", "Bash(*commit -n *)", "Bash(*commit-tickets*)", "Bash(*backlog task*)", "Bash(*sync-main*)", "Bash(*git push*@@KIT_BASE_BRANCH@@*)", "Bash(*git push*HEAD:@@KIT_BASE_BRANCH@@*)", "Bash(cd @@KIT_PROJECT_DIR@@ &&*)", "Bash(cd @@KIT_PROJECT_DIR@@;*)", "Bash(git -C @@KIT_PROJECT_DIR@@ *)"]
          prompt: |
            Read files with `view`, folders with `glob` and text with `grep`, one call each; never `cat`, `ls` or `echo` in the shell (the fence denies them).
            Read $ARTIFACTS_DIR/ci-diagnosis.md and apply the fix, tests first: when the fix changes behaviour, commit
            the test that shows the failure alone, then the fix. Run the tests, commit, and `git push`.
            This node may run again after a transient failure; the next attempt starts on the worktree as the last one
            left it. So first run `git status` and `git log --oneline "$(cat "$ARTIFACTS_DIR/ci-fix-before.sha")"..HEAD`:
            the commits listed are an earlier attempt's fix. Never apply it a second time: finish only what that attempt
            left (an uncommitted change, a push not made), then `git push`.
        # No commit after a diagnosis that starts `CAUSE: main` is no crash: the red came in with the base and
        # nothing on this branch can fix it, so the run ends as blocked (BLOCKED_NEEDS_PERSON, the blocked node) with
        # the diagnosis. No commit after any other diagnosis is a fix the agent failed to make: CI_FIX_NO_COMMIT.
        - id: fix-made
          depends_on: [fix]
          bash: |
            if [ "$(git rev-parse HEAD)" != "$(cat "$ARTIFACTS_DIR/ci-fix-before.sha" 2>/dev/null)" ]; then
              echo '{"committed": true, "blocked": false, "reason": ""}'; exit 0
            fi
            d="$ARTIFACTS_DIR/ci-diagnosis.md"
            cause=$(grep -m1 -v '^[[:space:]]*$' "$d" 2>/dev/null | tr -d '\r')
            if [ "$(printf '%s' "$cause" | tr -d '[:space:]`')" = CAUSE:main ]; then
              why=$(grep -v '^[[:space:]]*$' "$d" | sed -n 2p | tr -d '\r' | cut -c1-300)
              reason="BLOCKED_NEEDS_PERSON: CI is red from the base, not from this branch, and the fix agent made no commit on $(git rev-parse --short HEAD). ${cause}${why:+ — $why}. Diagnosis: $d. Fix the base (or rebase once it is green), then resume or start a new run."
              echo "$reason" >&2
              node -e 'console.log(JSON.stringify({ committed: false, blocked: true, reason: process.argv[1] }))' "$reason"
              exit 0
            fi
            echo "CI_FIX_NO_COMMIT: the fix agent made no commit on $(git rev-parse --short HEAD)${cause:+ ($cause)}" >&2; exit 1
          output_format:
            type: object
            properties:
              committed: { type: boolean }
              blocked: { type: boolean }
              reason: { type: string }
            required: [committed, blocked, reason]
        - id: blocked
          depends_on: [fix-made]
          when: "$fix-made.output.blocked == 'true'"
          cancel: "Blocked, needs a person: $fix-made.output.reason"
        - id: fix-ci
          depends_on: [fix-made]
          when: "$fix-made.output.committed == 'true'"
          timeout: 3600000
          bash: |
            pr=$open-pr.output.pr
            bash .archon/scripts/local-ci-run.sh "$pr" --head "$(git rev-parse HEAD)" || exit 1
            rc=0; bash .archon/scripts/red-triage.sh --pr "$pr" --base "$BASE_BRANCH" --report "$ARTIFACTS_DIR/red-triage.json" "$(git rev-parse HEAD)" >&2 || rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "CI is red on infrastructure only, also after its one rerun: no agent works on it. Fix the machine, then resume the run." >&2
              exit 1
            fi

  # Green CI by SHA marks the pull request ready. A pull request that conflicts with its base (main moved while CI ran)
  # is rebased onto the base and CI asked again; a conflict that stays, or a red run after that rebase, leaves it a draft
  # and fails the run, so a person sees it. Before the pull request turns ready, the test-first gate runs again
  # over the commits since its first pass (review fixes, CI fixes), and the generated block of the body is refreshed.
  # A red or missing verdict names the failing check (ci-by-sha.sh's detail), so the log says what to fix.
  - id: ready
    depends_on: [ci, triage, ci-fix]
    trigger_rule: none_failed_min_one_success
    timeout: 7200000
    bash: |
      set -euo pipefail
      pr=$open-pr.output.pr
      bash .archon/scripts/local-ci-run.sh "$pr" --head "$(git rev-parse HEAD)"
      result=$(bash .archon/scripts/ci-by-sha.sh)
      case "$result" in
        *'"state": "conflict"'*)
          echo "$result"
          before=$(git rev-parse HEAD)
          bash .archon/scripts/rebase-main.sh "$BASE_BRANCH" || [ "$(git rev-parse HEAD)" = "$before" ]
          bash .archon/scripts/local-ci-run.sh "$pr" --head "$(git rev-parse HEAD)"
          result=$(bash .archon/scripts/ci-by-sha.sh) ;;
      esac
      echo "$result"
      detail=$(node -e 'try { console.log(JSON.parse(process.argv[1]).detail) } catch { console.log(process.argv[1]) }' "$result")
      case "$result" in
        *'"state": "green"'*)
          bash .archon/scripts/tdd-check.sh "$ARTIFACTS_DIR" "$BASE_BRANCH" --since "$(cat "$ARTIFACTS_DIR/tdd-checked.sha")"
          ARTIFACTS_DIR="$ARTIFACTS_DIR" bash .archon/scripts/pr-refresh.sh "$pr" "$BASE_BRANCH" "$ARTIFACTS_DIR/pr-body.md"
          gh pr ready "$pr" ;;
        *'"state": "conflict"'*) echo "The pull request still conflicts with $BASE_BRANCH: it stays a draft." >&2; exit 1 ;;
        *'"state": "red"'*) echo "CI is red ($detail): it stays a draft." >&2; exit 1 ;;
        *) echo "No CI verdict for this commit ($detail): the pull request stays a draft (P5)." >&2; exit 1 ;;
      esac
