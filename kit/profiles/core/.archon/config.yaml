# Repo-scope Archon config. Model policy (user decision 2026-10-07): code and tests are written by
# Claude Sonnet 5.5; planning, analysis and review run on Claude Opus 5.5.
aliases:
  "@build":
    provider: claude
    model: claude-sonnet-5-5
  "@analyse":
    provider: claude
    model: claude-opus-5-5
  # Cheap, fast work: read-only exploring, and dispatcher nodes that only hand work to a .claude/agents agent
  # (the agent runs on the model in its own frontmatter). Used by build-feature's explore node.
  "@scout":
    provider: claude
    model: claude-haiku-5-5
  # GitHub Copilot CLI variants, used only by build-feature-copilot (generated by .archon/scripts/copilot-workflow.js).
  # THIS is the one place to edit the Copilot model ids: check what your plan offers with `copilot`, then `/model`.
  # No effort is set. Login: `copilot` then `/login`, or COPILOT_GITHUB_TOKEN in ~/.archon/.env (never in the repo).
  "@scout-copilot":
    provider: copilot
    model: claude-haiku-5.5
  "@build-copilot":
    provider: copilot
    model: claude-sonnet-5.5
  "@analyse-copilot":
    provider: copilot
    model: claude-opus-5.5

# Worktrees branch off main. Without this Archon fell back to a stale stored base branch that no longer exists.
worktree:
  baseBranch: @@KIT_BASE_BRANCH@@

# Env for every Archon process (bash nodes and the Claude Code session of each AI node), and only for those.
# - The commit-msg hook in run worktrees (owner decision D12, 2026-10-20): git reads core.hooksPath from these three
#   variables, so .archon/githooks/commit-msg checks each commit's subject and shape while the agent is still there. A
#   relative hooksPath resolves against the worktree, so each run uses its own branch's hook. Never clone-wide: that
#   would also turn on .githooks/pre-push in every checkout. Rollback: remove these three lines.
# - No background commands in agent nodes (R13): a command moved to the background keeps the node open until it ends.
#   Here only, never in .claude/settings.json: the delegator runs its ready waiter in the background.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.hooksPath
  GIT_CONFIG_VALUE_0: .archon/githooks
  CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
  BASH_DEFAULT_TIMEOUT_MS: "600000"
  BASH_MAX_TIMEOUT_MS: "1800000"
